<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>喜羊羊測驗區</title>
<style>
:root{
  --bg:#f6f5f1;--card:#fff;--ink:#1f2328;--sub:#5f6670;--line:#e3e1da;
  --pri:#2f5bd3;--pri-soft:#e8eefc;--ok:#1e8a4c;--ok-soft:#e5f5ec;--bad:#c8372d;--bad-soft:#fbe9e7;
  --c1:#c2571a;--c2:#2f5bd3;--c3:#7a3fc4;--c4:#1e8a4c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:24px;margin:8px 0 4px}
h2{font-size:20px;margin:22px 0 10px}
.muted{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:600;
  background:var(--pri);color:#fff;cursor:pointer;font-family:inherit;margin:8px 0}
.btn.sec{background:var(--card);color:var(--pri);border:1.5px solid var(--pri)}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);font-weight:500}
.btn.okb{background:var(--ok)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}
.topbar{position:sticky;top:0;z-index:5;background:rgba(246,245,241,.96);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:10px 14px 8px;margin:0 -14px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog>i{display:block;height:100%;background:var(--pri);width:0;transition:width .2s}
.tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.tabs a{flex:1;text-align:center;font-size:14px;padding:5px 6px;border-radius:8px;background:var(--card);
  border:1px solid var(--line);color:var(--ink);text-decoration:none;white-space:nowrap}
.subj{font-size:19px;font-weight:700;margin:26px 0 6px;padding-left:10px;border-left:5px solid var(--sc)}
.q .qn{font-weight:700;color:var(--sub);font-size:14px}
.q .qt{margin:4px 0 10px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fafaf8;border:1.5px solid var(--line);
  border-radius:10px;padding:11px 12px;margin:7px 0;font-size:16px;font-family:inherit;color:var(--ink);cursor:pointer}
.opt b{flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--sub);display:flex;align-items:center;
  justify-content:center;font-size:13px;color:var(--sub)}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.sel b{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong b{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.q.unans{border-color:#e7b54a}
.exp{background:#f4f2ec;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.tag{display:inline-block;font-size:13px;padding:1px 8px;border-radius:20px;margin-right:4px}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.pend{background:#fdf1d8;color:#9a6a00}
.big{font-size:54px;font-weight:800;text-align:center;line-height:1.1;margin:6px 0}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;border-top:4px solid var(--sc)}
.tile .n{font-size:26px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 4px;text-align:center}
th{color:var(--sub);font-weight:600;font-size:13px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin:10px 0}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-size:15px;font-family:inherit;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
.bottombar{position:fixed;left:0;right:0;bottom:0;background:rgba(246,245,241,.97);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bottombar .inner{max-width:640px;margin:0 auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:20px;max-width:400px;width:100%}
.note{font-size:13px;color:var(--sub);text-align:center;margin-top:16px}
.link{color:var(--pri);background:none;border:0;font-size:15px;padding:0;cursor:pointer;font-family:inherit}
.fillin{width:100%;font-size:20px;padding:12px;border:1.5px solid var(--line);border-radius:10px;font-family:inherit;margin-top:4px;background:#fafaf8}
.fillin:focus{outline:none;border-color:var(--pri);background:var(--pri-soft)}
.fillres{border-radius:10px;padding:10px 12px;margin:7px 0;font-size:16px;border:1.5px solid}
.fillres.right{border-color:var(--ok);background:var(--ok-soft)}
.fillres.wrong{border-color:var(--bad);background:var(--bad-soft)}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bottombar hidden" id="bottom"><div class="inner" id="bottomInner"></div></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
// ===== 題庫 =====
const SUBJ=[
  {k:'國文',c:'var(--c1)'},{k:'英文',c:'var(--c2)'},{k:'數學',c:'var(--c3)'},{k:'生物',c:'var(--c4)'}
];
const PAPERS=[{"no":"卷一","lv":"入門","grp":"綜合卷（國英數生）","ver":"段考2-卷一(入門)-v2","secs":[{"k":"國文","c":"var(--c1)"},{"k":"英文","c":"var(--c2)"},{"k":"數學","c":"var(--c3)"},{"k":"生物","c":"var(--c4)"}],"Q":[{"s":"國文","r":"L4 論語選","q":"《論語》是記錄孔子和弟子言行的書，它屬於哪一種體裁？","o":["章回小說","近體詩","語錄體","書信體"],"a":2,"e":"《論語》記錄孔子與弟子的言行對話，屬於語錄體。"},{"s":"國文","r":"L4 論語選","q":"《論語》是由誰編寫而成的？","o":["朱熹","孔子的弟子及再傳弟子","孟子","孔子親自寫成"],"a":1,"e":"《論語》由孔子的弟子和再傳弟子記錄、編纂而成，不是孔子自己寫的。"},{"s":"國文","r":"L4 論語選","q":"孔子是哪一個學派的代表人物？","o":["儒家","道家","墨家","法家"],"a":0,"e":"孔子是儒家學派的創始人。道家代表是老子、莊子。"},{"s":"國文","r":"L4 論語選","q":"「四書」包括哪四本書？下列何者「不屬於」四書？","o":["孟子","詩經","中庸","論語"],"a":1,"e":"四書：《論語》《孟子》《大學》《中庸》。《詩經》屬於五經。"},{"s":"國文","r":"L5 背影","q":"〈背影〉的作者是誰？","o":["杏林子","楊喚","朱自清","胡適"],"a":2,"e":"〈背影〉是朱自清的散文名篇。"},{"s":"國文","r":"L5 背影","q":"〈背影〉中，父親在車站特地越過月臺去買了什麼給作者？","o":["橘子","車票","報紙","包子"],"a":0,"e":"父親吃力地爬上月臺，買了朱紅的橘子。"},{"s":"國文","r":"L5 背影","q":"〈背影〉屬於哪一種文體？","o":["新詩","劇本","散文","小說"],"a":2,"e":"〈背影〉是記敘抒情的散文。"},{"s":"國文","r":"L6 心囚","q":"〈心囚〉的作者是誰？","o":["朱自清","胡適","杏林子","楊喚"],"a":2,"e":"〈心囚〉作者杏林子，本名劉俠。"},{"s":"國文","r":"L5 背影","q":"「蹣跚」的正確讀音是哪一個？","o":["ㄇㄢˇ ㄕㄢ","ㄆㄢˊ ㄕㄢ","ㄇㄢˊ ㄕㄢ","ㄆㄢˇ ㄕㄢˋ"],"a":1,"e":"蹣跚讀 ㄆㄢˊ ㄕㄢ，形容走路緩慢、搖擺不穩。"},{"s":"國文","r":"L4 論語選","q":"「學而時習之，不亦說乎？」句中的「說」是什麼意思？","o":["解說","說服","說話","高興、喜悅"],"a":3,"e":"「說」通「悅」，讀 ㄩㄝˋ，意思是高興。"},{"s":"英文","r":"U3","q":"____ quiet in the library, please.","o":["Don't","Is","Are","Be"],"a":3,"e":"祈使句用原形動詞開頭，be 動詞的原形是 Be。"},{"s":"英文","r":"U3","q":"____ run in the hallway. It's dangerous.","o":["Not","Doesn't","Don't","No"],"a":2,"e":"否定祈使句：Don't + 原形動詞。"},{"s":"英文","r":"U3","q":"Tom can ____ the guitar very well.","o":["playing","plays","play","to play"],"a":2,"e":"助動詞 can 後面接原形動詞。"},{"s":"英文","r":"U4","q":"A: What day is it today?\nB: ____","o":["It's May 5th.","It's sunny.","It's Friday.","It's two o'clock."],"a":2,"e":"What day 問「星期幾」。May 5th 是日期，two o'clock 是時間。"},{"s":"英文","r":"U4","q":"A: What time is it?\nB: ____","o":["It's June 1st.","It's hot.","It's Monday.","It's seven thirty."],"a":3,"e":"What time 問「幾點」，回答時間。"},{"s":"英文","r":"U4","q":"A: What are you doing?\nB: I ____ TV.","o":["is watching","watch","am watching","watching"],"a":2,"e":"問正在做什麼，回答現在進行式；主詞 I → am watching。"},{"s":"英文","r":"U3","q":"Let's ____ basketball after school.","o":["to play","plays","play","playing"],"a":2,"e":"Let's + 原形動詞。"},{"s":"英文","r":"U3","q":"My brother and I can't do it. Please help ____.","o":["we","our","us","ours"],"a":2,"e":"help 後面接受格；we 的受格是 us。"},{"s":"英文","r":"U3","q":"Look at ____. He is so tall.","o":["him","he's","he","his"],"a":0,"e":"at 是介系詞，後面接受格 him。"},{"s":"英文","r":"U3","q":"A: Can I sit here?\nB: ____","o":["Yes, I can.","Sure.","No, I am not.","You're welcome."],"a":1,"e":"對方徵求同意，可以回答 Sure."},{"s":"數學","r":"2-1","q":"下列哪一個數是 12 的因數？","o":["8","5","6","24"],"a":2,"e":"12 的因數：1、2、3、4、6、12。24 是 12 的倍數。"},{"s":"數學","r":"2-1","q":"下列哪一個數是質數？","o":["15","2","21","9"],"a":1,"e":"2 只有 1 和 2 兩個因數，是質數（也是唯一的偶數質數）。9=3×3，15=3×5，21=3×7。"},{"s":"數學","r":"2-1","q":"關於「1」的敘述，哪一項正確？","o":["1 是合數","1 是質數","1 既不是質數也不是合數","1 是最小的質數"],"a":2,"e":"質數要剛好有 2 個因數；1 只有 1 個因數，所以既不是質數也不是合數。最小的質數是 2。"},{"s":"數學","r":"2-1","q":"下列哪一個數是 5 的倍數？","o":["1237","1235","1234","1236"],"a":1,"e":"個位數是 0 或 5 的數，就是 5 的倍數。"},{"s":"數學","r":"2-2","q":"8 和 12 的最大公因數是多少？","o":["2","4","96","24"],"a":1,"e":"8 的因數：1,2,4,8；12 的因數：1,2,3,4,6,12。共同最大的是 4。"},{"s":"數學","r":"2-2","q":"4 和 6 的最小公倍數是多少？","o":["24","12","2","10"],"a":1,"e":"4 的倍數：4,8,12…；6 的倍數：6,12…。最小的共同倍數是 12。"},{"s":"數學","r":"2-3","q":"把 12/18 約成最簡分數是多少？","o":["2/3","6/9","3/2","4/6"],"a":0,"e":"分子分母同除以最大公因數 6：12÷6=2，18÷6=3。"},{"s":"數學","r":"2-3","q":"計算：1/2 + 1/3 = ？","o":["1/6","2/6","5/6","2/5"],"a":2,"e":"通分：3/6 + 2/6 = 5/6。"},{"s":"數學","r":"2-4","q":"2³ = ？","o":["9","5","8","6"],"a":2,"e":"2³ = 2×2×2 = 8，不是 2×3。"},{"s":"數學","r":"2-4","q":"3² × 3³ = ？","o":["9⁶","9⁵","3⁵","3⁶"],"a":2,"e":"底數相同相乘，指數相加：3²⁺³ = 3⁵。"},{"s":"生物","r":"2-3","q":"光合作用的主要產物是什麼？","o":["氧氣和水","葡萄糖和氧氣","二氧化碳和水","葡萄糖和二氧化碳"],"a":1,"e":"二氧化碳 + 水 →（光、葉綠素）→ 葡萄糖 + 氧氣。"},{"s":"生物","r":"2-3","q":"植物進行光合作用的胞器是什麼？","o":["葉綠體","液胞","粒線體","細胞核"],"a":0,"e":"葉綠體含葉綠素，可吸收光能進行光合作用。"},{"s":"生物","r":"2-3","q":"在食物上滴碘液，如果含有澱粉，會變成什麼顏色？","o":["黃色","藍黑色","紅色","無色"],"a":1,"e":"碘液遇澱粉呈藍黑色。"},{"s":"生物","r":"2-4","q":"食物中的澱粉最早在哪個部位開始被消化？","o":["口腔","小腸","胃","大腸"],"a":0,"e":"唾液含澱粉酶，澱粉在口腔就開始被分解。"},{"s":"生物","r":"2-4","q":"人體吸收養分最主要的器官是哪一個？","o":["食道","胃","小腸","大腸"],"a":2,"e":"小腸是消化和吸收養分的主要場所。"},{"s":"生物","r":"3-1～3-2","q":"植物體中負責把根吸收的水分往上運送的構造是什麼？","o":["韌皮部","氣孔","木質部","形成層"],"a":2,"e":"木質部運送水分和礦物質（由下往上）。"},{"s":"生物","r":"3-1～3-2","q":"葉子製造的養分，是靠哪一個構造運送到植物各部位？","o":["木質部","氣孔","根毛","韌皮部"],"a":3,"e":"韌皮部運送養分，可以往上也可以往下。"},{"s":"生物","r":"3-3","q":"人的心臟有幾個腔室？","o":["2 個","5 個","4 個","3 個"],"a":2,"e":"左心房、左心室、右心房、右心室，共 4 個。"},{"s":"生物","r":"3-3","q":"血液中負責運送氧氣的是哪一種成分？","o":["紅血球","白血球","血小板","血漿"],"a":0,"e":"紅血球含血紅素，可攜帶氧氣。"},{"s":"生物","r":"3-4","q":"人體防禦病原體的第一道防線是什麼？","o":["淋巴結","抗體","皮膚和黏膜","白血球"],"a":2,"e":"皮膚和黏膜阻擋病原體進入人體，是第一道防線。"}]},{"no":"卷二","lv":"基礎","grp":"綜合卷（國英數生）","ver":"段考2-卷二(基礎)-v2","secs":[{"k":"國文","c":"var(--c1)"},{"k":"英文","c":"var(--c2)"},{"k":"數學","c":"var(--c3)"},{"k":"生物","c":"var(--c4)"}],"Q":[{"s":"國文","r":"L4 論語選","q":"「有朋自遠方來，不亦樂乎？」的意思是什麼？","o":["朋友住得太遠，不容易見面","遠方的朋友比較好","有志同道合的朋友從遠方來，不是很快樂嗎？","朋友從遠方來，一定要請客"],"a":2,"e":"「不亦……乎」是「不是很……嗎」，表示非常快樂。"},{"s":"國文","r":"L4 論語選","q":"「人不知而不慍」的「慍」是什麼意思？","o":["知道","學習","生氣、怨恨","溫暖"],"a":2,"e":"慍：讀 ㄩㄣˋ，生氣、怨恨。別人不了解自己也不生氣，才是君子。"},{"s":"國文","r":"L4 論語選","q":"「吾日三省吾身」是誰說的？","o":["孔子","曾子","子路","孟子"],"a":1,"e":"這是曾子說的話，記錄在《論語》中。"},{"s":"國文","r":"L4 論語選","q":"「溫故而知新，可以為師矣。」句中的「故」指的是什麼？","o":["舊的知識","所以","故事","故鄉"],"a":0,"e":"故：學過的舊知識。溫習舊知識而能有新體會。"},{"s":"國文","r":"L5 背影","q":"「那年冬天，祖母死了，父親的差使也交卸了，正是禍不單行的日子。」「禍不單行」是什麼意思？","o":["做壞事會有報應","不幸的事接連發生","好事成雙","災禍只有一件"],"a":1,"e":"禍不單行：不幸的事情往往接二連三地發生。"},{"s":"國文","r":"L5 背影","q":"父親不斷叮嚀茶房照顧作者，作者「心裡暗笑他的迂」。「迂」是什麼意思？","o":["言行拘泥、不切實際","生氣","勇敢","聰明"],"a":0,"e":"迂：讀 ㄩ，拘泥、不知變通。作者當時覺得父親太過操心。"},{"s":"國文","r":"L5 背影","q":"在車上，作者把父親為他做的 各位數字和是 3 的倍數，這個數就是 3 的倍數：4+1+8+5 = 18 ✓。"},{"s":"數學","r":"2-1","q":"下列哪一個數是合數？","o":["21","19","13","17"],"a":0,"e":"21 = 3×7，除了 1 和自己還有其他因數，是合數。"},{"s":"數學","r":"2-1","q":"60 的標準分解式是哪一個？","o":["2 × 30","4 × 15","2 × 3 × 10","2² × 3 × 5"],"a":3,"e":"60 = 2×2×3×5 = 2²×3×5，全部是質數並用指數表示。"},{"s":"數學","r":"2-2","q":"12 和 18 的最大公因數是多少？","o":["36","216","6","3"],"a":2,"e":"12 = 2²×3，18 = 2×3²，共同部分取次方小的：2×3 = 6。"},{"s":"數學","r":"2-2","q":"6、8、12 三個數的最小公倍數是多少？","o":["96","2","48","24"],"a":3,"e":"6 = 2×3，8 = 2³，12 = 2²×3，每個質因數取次方最大的：2³×3 = 24。"},{"s":"數學","r":"2-2","q":"下列哪一組數「互質」？","o":["4 和 6","8 和 9","9 和 12","10 和 15"],"a":1,"e":"互質：最大公因數是 1。8 和 9 的最大公因數是 1；其他組分別有 2、3、5。"},{"s":"數學","r":"2-3","q":"計算：2/3 + (−5/6) = ？","o":["7/6","−3/9","−1/6","1/6"],"a":2,"e":"通分：4/6 + (−5/6) = −1/6。"},{"s":"數學","r":"2-3","q":"計算：(−3/4) × 8/9 = ？","o":["−27/32","−24/36","−2/3","2/3"],"a":2,"e":"負 × 正 = 負；約分後 −(1×2)/(1×3) = −2/3。"},{"s":"數學","r":"2-4","q":"2³ × 2⁴ = ？","o":["2⁷","4⁷","4¹²","2¹²"],"a":0,"e":"底數相同相乘，指數相加 → 2⁷。"},{"s":"數學","r":"2-4","q":"(2³)² = ？","o":["2⁶","4³","2⁵","2⁹"],"a":0,"e":"次方的次方，指數相乘：2³ˣ² = 2⁶。"},{"s":"生物","r":"2-3","q":"光合作用的原料是什麼？","o":["氧氣和水","葡萄糖和氧氣","澱粉和水","二氧化碳和水"],"a":3,"e":"原料：二氧化碳 + 水；產物：葡萄糖 + 氧氣。"},{"s":"生物","r":"2-3","q":"葉片主要從哪裡吸收空氣中的二氧化碳？","o":["葉脈","氣孔","木質部","根毛"],"a":1,"e":"氣孔是氣體進出葉片的通道。"},{"s":"生物","r":"2-3","q":"葉片上的氣孔是由哪一種細胞圍成的？","o":["根毛細胞","表皮毛","保衛細胞","紅血球"],"a":2,"e":"兩個保衛細胞圍成氣孔，可控制氣孔的開關。"},{"s":"生物","r":"2-4","q":"胃液主要可以消化哪一種養分？","o":["纖維素","蛋白質","澱粉","脂質"],"a":1,"e":"胃液含蛋白酶，開始分解蛋白質。"},{"s":"生物","r":"2-4","q":"膽汁是由哪一個器官製造的？","o":["胰臟","肝臟","膽囊","胃"],"a":1,"e":"膽汁由肝臟製造，儲存在膽囊。"},{"s":"生物","r":"2-4","q":"大腸的主要功能是什麼？","o":["吸收水分","分泌唾液","消化蛋白質","分泌膽汁"],"a":0,"e":"大腸主要吸收水分，剩下的殘渣形成糞便。"},{"s":"生物","r":"3-1～3-2","q":"植物的根主要靠什麼構造吸收水分？","o":["氣孔","根毛","葉綠體","韌皮部"],"a":1,"e":"根毛增加吸收面積，是吸收水分的主要構造。"},{"s":"生物","r":"3-3","q":"把血液從心臟帶出去的血管叫什麼？","o":["微血管","靜脈","動脈","淋巴管"],"a":2,"e":"動脈：血液離開心臟；靜脈：血液流回心臟。"},{"s":"生物","r":"3-3","q":"血液中幫助傷口止血、凝固的是哪一種成分？","o" 2-2","q":"把長 24 公分、寬 36 公分的長方形紙，剪成大小相同的正方形且沒有剩，正方形邊長最長是幾公分？","o":["6","72","12","24"],"a":2,"e":"邊長要同時整除 24 和 36，最長就是最大公因數 12。"},{"s":"數學","r":"2-2","q":"A 公車每 12 分鐘一班，B 公車每 18 分鐘一班。兩車同時發車後，至少再過幾分鐘會再同時發車？","o":["72","6","216","36"],"a":3,"e":"要找 12 和 18 的最小公倍數：36。"},{"s":"數學","r":"2-3","q":"計算：(−5/6) ÷ (−10/3) = ？","o":["25/9","−25/9","1/4","−1/4"],"a":2,"e":"除以一個數＝乘以倒數：(−5/6) × (−3/10) = 15/60 = 1/4。"},{"s":"數學","r":"2-3","q":"下列哪一個數最大？","o":["−2/3","−1/2","−1/3","−3/4"],"a":2,"e":"負數的絕對值越小越大。1/3 最小，所以 −1/3 最大。"},{"s":"數學","r":"2-4","q":"計算：(−3)⁴ ÷ 3² = ？","o":["−3","9","3","−9"],"a":1,"e":"(−3)⁴ = 81（負數偶數次方為正），81 ÷ 9 = 9。"},{"s":"數學","r":"2-4","q":"計算：(−2)³ × (−2)² = ？","o":["32","−32","−64","64"],"a":1,"e":"底數相同指數相加：(−2)⁵ = −32（負數奇數次方為負）。"},{"s":"生物","r":"2-3","q":"把植物放暗處一天後，用鋁箔遮住一片葉子的一部分，照光數小時，再去除葉綠素並滴碘液。結果會如何？","o":["照光部分變藍黑色，遮光部分不變","整片葉子都變藍黑色","整片葉子都不變色","遮光部分變藍黑色，照光部分不變"],"a":0,"e":"照光部分進行光合作用產生澱粉，遇碘液變藍黑色；遮光部分不產生澱粉。"},{"s":"生物","r":"2-3","q":"光合作用實驗中，把葉片放進酒精中「隔水加熱」的目的是什麼？","o":["溶出葉綠素，方便觀察碘液顏色變化","讓葉片產生澱粉","讓葉片變軟好剪","殺死細菌"],"a":0,"e":"酒精可溶解葉綠素，葉片變白後才看得清楚碘液反應。酒精易燃，所以要隔水加熱。"},{"s":"生物","r":"2-4","q":"關於膽汁的敘述，哪一項正確？","o":["可以使脂肪乳化，幫助消化","負責消化蛋白質","由膽囊製造","含有消化酵素"],"a":0,"e":"膽汁由肝臟製造、儲存在膽囊；不含酵素，能把脂肪乳化成小油滴。"},{"s":"生物","r":"2-4","q":"小腸內壁有許多絨毛，這有什麼好處？","o":["增加表面積，有利於吸收養分","讓食物走得更快","儲存食物","分泌膽汁"],"a":0,"e":"絨毛大大增加小腸內表面積，吸收養分更有效率。"},{"s":"生物","r":"3-1～3-2","q":"植物體內的水分主要從葉片的哪裡散失到空氣中（蒸散作用）？","o":["根毛","花瓣","氣孔","韌皮部"],"a":2,"e":"蒸散作用：水分以水蒸氣的形式主要從氣孔散失。"},{"s":"生物","r":"3-3","q":"人體心臟中，把含氧量高的血液送往全身的是哪一個腔室？","o":["右心室","右心房","左心房","左心室"],"a":3,"e":"左心室壁最厚，收縮時把充氧血經主動脈送往全身。"},{"s":"生物","r":"3-3","q":"血液和身體細胞之間的物質交換，主要在哪一種血管進行？","o":["微血管","主動脈","靜脈","動脈"],"a":0,"e":"微血管管壁很薄，是物質交換的場所。"},{"s":"生物","r":"3-4","q":"接種疫苗主要能讓人體產生什麼效果？","o":["讓身體預先產生抗體與記憶，日後遇到同種病原體能快速抵抗","增加紅血球數量","直接殺死體內所有細菌","讓血液循環變快"],"a":0,"e":"疫苗刺激身體產生抗體與記憶細胞。"},{"s":"生物","r":"3-4","q":"生病時，脖子的淋巴結常常會腫大，最可能的原因是什麼？","o":["淋巴結裡積了水","淋巴結正在製造血小板","淋巴結中的白血球正在對抗病原體","淋巴結在消化食物"],"a":2,"e":"淋巴結含大量白血球，對抗病原體時會腫大。"},{"s":"生物","r":"2-4","q":"人自己不能製造養分，必須從食物獲得，屬於哪一類生物？","o":["自營生物","兩者都不是","異營生物","兩者都是"],"a":2,"e":"植物能行光合作用自己製造養分是自營；人和動物是異營。"}]},{"no":"卷四","lv":"進階","grp":"綜合卷（國英數生）","ver":"段考2-卷四(進階)-v2","secs":[{"k":"國文","c":"var(--c1)"},{"k":"英文","c":"var(--c2)"},{"k":"數學","c":"var(--c3)"},{"k":"生物","c":"var(--c4)"}],"Q":[{"s":"國文","r":"L4 論語選","q":"曾子「吾日三省吾身」，每天反省的事「不包括」下列哪一項？","o":["老師傳授的學問是否複習","替人謀劃事情是否盡心","是否孝順父母","和朋友交往是否誠信"],"a":2,"e":"三省：為人謀而不忠乎？與朋友交而不信乎？傳不習乎？沒有提到孝順。"},{"s":"國文","r":"L4 論語選","q":"「傳不習乎？」句中的「傳」是什麼意思？","o":["傳說","老師傳授的學問","傳記","傳遞消息"],"a":1,"e":"傳：讀 ㄔㄨㄢˊ，老師傳授的知識學問。"},{"s":"國文","r":"L4 論語選","q":"「敏而好學，不恥下問」中，「不恥下問」是什麼意思？","o":["不以向地位或學問比自己低的人請教為羞恥","不好意思問問題","只問比自己厲害的人","問問題很可恥"],"a":0,"e":"不恥下問：願意向任何人請教，不覺得丟臉，表示謙虛好學。"},{"s":"國文","r":"L4 論語選","q":"「由，誨女知之乎？」句中的「女」是什麼意思？","o":["你","如果","他","女子"],"a":0,"e":"「女」通「汝」，讀 ㄖㄨˇ，意思是「你」。由是子路的名字。"},{"s":"國文","r":"L5 背影","q":"〈背影〉全文中，作者一共流了幾次眼淚？","o":["五次","四次","三次","兩次"],"a":1,"e":"四次：在徐州看到家中景況；看父親買橘子的背影；父親背影消失在人群中；讀父親來信。"},{"s":"國文","r":"L5 背影","q":"〈背影〉開頭先寫「我最不能忘記的是他的背影」，再回頭敘述當年的事，這是哪一種寫作手法？","o":["插敘法","順敘法","補敘法","倒敘法"],"a":3,"e":"先寫結果或現在的感受，再回頭敘述往事，是倒敘法。"},{"s":"國文","r":"L5 背影","q":"父親來信說「大約大去之期不遠矣」，「大去」是什麼意思？","o":["搬到大城市","死亡、離開人世","長大","出遠門"],"a":1,"e":"大去：一去不回，指死亡。父親覺得自己身體不好，來日不多。"},{"s":"國文","r":"L5 背影","q":"作者回想時說「我那時真是聰明過分」，真正的意思是什麼？","o":["說茶房很聰明","覺得父親不夠聰明","稱讚自己很聰明","後悔當時自以為是，不懂父親的關愛"],"a":3,"e":"這是反話，表達自責與懊悔：當時自以為聰明，暗笑父親，其實不懂父愛。"},{"s":"國文","r":"L6 心囚","q":"依照〈心囚〉的觀點，下列哪一個人最可能是「被自己的心囚禁」的人？","o":["搬到新環境主動交朋友的人","生病仍努力讀書的人","因為害怕失敗，從不敢嘗試新事物的人","坐輪椅仍熱心參加活動的人"],"a":2,"e":"心囚是被自己的恐懼、成見困住。其他三位雖有限制，心靈卻是自由的。"},{"s":"國文","r":"L5 背影","q":"「他用兩手攀著上面，兩腳再向上縮；他肥胖的身子向左微傾，顯出努力的樣子。」這段文字主要運用了哪一種寫作技巧？","o":["譬喻","摹寫（視覺）","誇飾","排比"],"a":1,"e":"把父親爬月臺的動作具體描繪出來，讓讀者彷彿看見，是視覺摹寫。"},{"s":"英文","r":"U3","q":"Please give ____ the book. I want to read it.","o":["mine","my","I","me"],"a":3,"e":"give 後面接受格 me。"},{"s":"英文","r":"U3","q":"Look at ____. They are so cute.","o":["them","their","theirs","they"],"a":0,"e":"介系詞 at 後面接受格；they 的受格是 them。"},{"s":"英文","r":"U4","q":"A: Is Linda singing?\nB: No, she ____. She's dancing.","o":["can't","isn't","don't","doesn't"],"a":1,"e":"用 Is 問，否定簡答 No, she isn't."},{"s":"英文","r":"U4","q":"A: What ____ your brothers doing?\nB: They're playing games.","o":["do","are","does","is"],"a":1,"e":"your brothers 是複數 → What are … doing?"},{"s":"英文","r":"U4","q":"Look! The singer ____ hands with her fans.","o":["are shaking","shakes","shake","is shaking"],"a":3,"e":"Look! 正在進行；singer 單數 → is shaking（shake 去 e 加 ing）。"},{"s":"英文","r":"U4","q":"A: Which kind of music do you like?\nB: ____","o":["I like jazz.","Yes, I like.","At the park.","It's 7 p.m."],"a":0,"e":"問喜歡哪一種音樂，回答音樂類型。"},{"s":"英文","r":"U3","q":"Don't ____ noisy in class.","o":["being","is","are","be"],"a":3,"e":"Don't + 原形，be 動詞原形是 be。"},{"s":"英文","r":"U4","q":"Look! Grandma ____ a letter.","o":["writes","are writing","is writing","is writeing"],"a":2,"e":"write 去 e 加 ing → writing；Grandma 單數 → is writing。"},{"s":"英文","r":"U3","q":"A: Let's play basketball after school.\nB: ____","o":["I'm fine.","You're welcome.","Nice to meet you.","Sounds good!"],"a":3,"e":"對方提議時，同意可以說 Sounds good! / OK. / Good idea!"},{"s":"英文","r":"U3","q":"Don't ____ in class.","o":["talking","talks","talk","to talk"],"a":2,"e":"Don't + 原形動詞。"},{"s":"數學","r":"2-1","q":"若 2ᵃ × 3ᵇ = 72，則 a + b = ？","o":["4","5","6","7"],"a":1,"e":"72 = 2³ × 3²，a = 3、b = 2，a + b = 5。"},{"s":"數學","r":"2-2","q":"48 和 72 的最小公倍數是多少？","o":["288","3456","144","24"],"a":2,"e":"48 = 2⁴×3，72 = 2³×3²，最小公倍數 = 2⁴×3² = 144。"},{"s":"數學","r":"2-2","q":"a 和 b 的最大公因數是 6，最小公倍數是 72。若 a = 18，則 b = ？","o":["12","24","4","36"],"a":1,"e":"兩數相乘 ＝ 最大公因數 × 最小公倍數：18 × b = 6 × 72，b = 24。"},{"s":"數學","r":"2-1","q":"72 一共有幾個正因數？","o":["8 個","24 個","12 個","10 個"],"a":2,"e":"72 = 2³ × 3²，正因數個數 = (3+1)×(2+1) = 12。"},{"s":"數學","r":"2-3","q":"計算：(−1/2) + 3/4 × (−2/3) = ？","o":["−1/6","0","1/6","−1"],"a":3,"e":"先乘後加：3/4 × (−2/3) = −1/2；−1/2 + (−1/2) = −1。"},{"s":"數學","r":"2-4","q":"計算：(−2/3)² = ？","o":["4/3","−4/3","−4/9","4/9"],"a":3,"e":"(−2/3)×(−2/3) = 4/9，負負得正。"},{"s":"數學","r":"2-4","q":"2⁵ × 4² = ？","o":["2⁹","2⁷","2¹⁰","8⁷"],"a":0,"e":"4² = (2²)² = 2⁴，2⁵ × 2⁴ = 2⁹。"},{"s":"數學","r":"2-4","q":"計算：(3²)³ ÷ 3⁴ = ？","o":["9","81","27","3"],"a":0,"e":"(3²)³ = 3⁶，3⁶ ÷ 3⁴ = 3² = 9。"},{"s":"數學","r":"2-2","q":"老師有 48 顆糖和 60 片餅乾，要平分給一些學生，且都沒有剩下。最多可以分給幾位學生？","o":["12","24","240","6"],"a":0,"e":"人數要同時整除 48 和 60，最多就是最大公因數 12。"},{"s":"數學","r":"2-2","q":"1 到 50 的整數中，同時是 4 和 6 的倍數的數有幾個？","o":["4","3","12","8"],"a":0,"e":"同時是 4 和 6 的倍數 ＝ 12 的倍數：12、24、36、48，共 4 個。"},{"s":"生物","r":"2-3","q":"關於植物的光合作用和呼吸作用，哪一項正確？","o":["只有葉子會進行呼吸作用","植物白天和晚上都會進行呼吸作用","植物白天不呼吸","植物晚上進行光合作用"],"a":1,"e":"呼吸作用全天都在進行；光合作用只在有光時進行。"},{"s":"生物","r":"2-4","q":"哪一種消化液可以消化醣類、蛋白質和脂質三大類養分？","o":["膽汁","胃液","唾液","胰液"],"a":3,"e":"胰液含多種酵素，三大類養分都能消化。唾液只消化澱粉，胃液主要消化蛋白質，膽汁不含酵素。"},{"s":"生物","r":"2-4","q":"下列哪一個器官「不是」食物會通過的消化道？","o":["肝臟","小腸","胃","食道"],"a":0,"e":"肝臟是消化腺，分泌膽汁，但食物不會經過它。"},{"s":"生物","r":"3-1～3-2","q":"把樹幹剝去一圈樹皮（含韌皮部），一段時間後切口「上方」會腫大，原因是什麼？","o":["樹皮長太快","葉子製造的養分往下運送受阻而堆積","水分往上送不過去而堆積","根吸收太多水"],"a":1,"e":"韌皮部被切斷，養分無法往下運送，堆積在切口上方。水分走木質部，不受影響。"},{"s":"生物","r":"3-1～3-2","q":"玉米是單子葉植物，它的莖中維管束是怎麼排列的？","o":["散生排列","沒有維管束","只有木質部","環狀排列"],"a":0,"e":"單子葉植物莖的維管束散生；雙子葉植物則排成環狀。"},{"s":"生物","r":"3-3","q":"肺動脈裡流的是哪一種血液？","o":["缺氧血","組織液","充氧血","淋巴液"],"a":0,"e":"肺動脈把右心室的缺氧血送到肺部交換氣體，所以是缺氧血（動脈不一定是充氧血）。"},{"s":"生物","r":"3-3","q":"靜脈中的瓣膜有什麼功能？","o":["製造血球","讓血管變粗","防止血液倒流","過濾病菌"],"a":2,"e":"靜脈血壓低，瓣膜可以防止血液倒流。"},{"s":"生物","r":"3-3","q":"用手指按在手腕上測量脈搏，可以得知什麼？","o":["呼吸次數","心跳次數","體溫","血糖高低"],"a":1,"e":"脈搏是心臟搏動推動血液使動脈跳動，次數和心跳相同。"},{"s":"生物","r":"3-4","q":"得過水痘的人，通常不會再得水痘，主要原因是什麼？","o":["皮膚變厚了","體內已有對抗水痘病毒的抗體與記憶細胞","水痘病毒已經滅絕","紅血球變多了"],"a":1,"e":"第一次感染後，身體會記住這種病原體，下次能快速產生抗體。"},{"s":"生物","r":"3-4","q":"愛滋病毒（HIV）主要破壞人體的哪一個系統？","o":["呼吸系統","消化系統","免疫系統","骨骼系統"],"a":2,"e":"HIV 攻擊白血球（淋巴球），使免疫力下降。"}]},{"no":"卷五","lv":"挑戰","grp":"綜合卷（國英數生）","ver":"段考2-卷五(挑戰)-v2","secs":[{"k":"國文","c":"var(--c1)"},{"k":"英文","c":"var(--c2)"},{"k":"數學","c":"var(--c3)"},{"k":"生物","c":"var(--c4)"}],"Q":[{"s":"國文","r":"L4 論語選","q":"下列《論語》文句和意思的配對，哪一項「錯誤」？","o":["學而不思則罔：只思考不學習會有危險","見賢思齊：看到賢人想向他看齊","人不知而不慍：別人不了解自己也不生氣","溫故而知新：從舊知識中得到新體會"],"a":0,"e":"學而不思則罔：只學不思會迷惑。「只思考不學習」是「思而不學則殆」。"},{"s":"國文","r":"L4 論語選","q":"「知之為知之，不知為不知，是知也。」句中哪一個「知」讀作 ㄓˋ，意思是「智慧」？","o":["「是知也」的「知」","「不知」的「知」","「為知之」的「知」","第一個「知之」的「知」"],"a":0,"e":"「是知也」的「知」通「智」，讀 ㄓˋ；其他都是「知道」的意思。"},{"s":"國文","r":"L4 論語選","q":"「不亦說乎？」「不亦樂乎？」「不亦君子乎？」這三句用的是哪一種語氣？","o":["單純的感嘆，沒有問句","命令別人去做","表面是問句，答案就在問題的反面（激問）","真的不知道答案而發問"],"a":2,"e":"激問：用反問加強語氣，「不是很快樂嗎？」意思就是「很快樂」。"},{"s":"國文","r":"L5 背影","q":"「他終於不放心，怕茶房不妥貼；頗躊躇了一會。」「躊躇」是什麼意思？","o":["生氣","快速決定","傷心流淚","猶豫不決"],"a":3,"e":"躊躇：猶豫、拿不定主意。父親在想到底要不要親自送兒子。"},{"s":"國文","r":"L5 背影","q":"「父親的差使也交卸了」這句話說明父親當時的處境是什麼？","o":["生了重病","升官了","失去了工作","去旅行"],"a":2,"e":"差使：工作職務；交卸：卸下職務。父親失業，家中經濟困難。"},{"s":"國文","r":"L5 背影","q":"文章最後，作者「在晶瑩的淚光中」又看見父親的背影，是因為什麼？","o":["在車站又遇見父親","讀到父親來信說身體不好、自覺不久於人世","想起祖母過世","看到別人買橘子"],"a":1,"e":"父親來信提到「大去之期不遠矣」，作者讀信時想起父親的背影而落淚。"},{"s":"國文","r":"L5 背影","q":"作者為什麼選擇「背影」，而不寫父親的正面表情來表現父愛？","o":["因為父親長得不好看","背影更能表現父親默默付出、含蓄深沉的愛","因為背影比較容易描寫","因為作者沒看到父親的臉"],"a":1,"e":"父親不善言詞，愛是默默的行動。背影象徵這份含蓄的父愛，也留給讀者想像。"},{"s":"國文","r":"L5 背影","q":"在徐州，父親對作者說：「事已如此，不必難過，好在天無絕人之路！」這句話表現父親的哪一種態度？","o":["責怪兒子","雖然遭遇困境，仍堅強面對並安慰兒子","準備放棄一切","抱怨命運不公平"],"a":1,"e":"父親自己正面臨喪母、失業，卻反過來安慰兒子，表現堅強與慈愛。"},{"s":"國文","r":"L6 心囚","q":"杏林子的人生經歷和〈心囚〉主旨有什麼關係？","o":["她主張人要待在家裡","她的身體行動受限，卻以心靈的自由鼓勵別人突破自我限制","她坐過牢，所以寫監獄生活","她身體健康，所以不懂病痛"],"a":1,"e":"作者長年受病痛限制，卻活得積極自由，親身證明「心」才是最重要的。"},{"s":"國文","r":"綜合 L4～L6","q":"下列有關本次範圍課文的敘述，哪一項正確？","o":["〈背影〉以父親買橘子時的背影為描寫重點","〈心囚〉是一首童詩","《論語》是孔子親自寫成的","〈背影〉的作者是胡適"],"a":0,"e":"〈背影〉作者朱自清；《論語》由弟子編纂；〈心囚〉是散文。"},{"s":"英文","r":"Review 2","q":"下列哪一個句子「正確」？","o":["Let's go to the zoo.","Don't is noisy.","Tom are running.","She can sings well."],"a":0,"e":"can 後接原形（sing）；Don't be noisy；Tom is running。"},{"s":"英文","r":"U4","q":"A: ____ the students practicing now?\nB: No, they aren't.","o":["Does","Is","Do","Are"],"a":3,"e":"the students 是複數，現在進行式問句用 Are。"},{"s":"英文","r":"U3","q":"下列哪一個句子「正確」？","o":["Let's not play here.","Don't let's play here.","Let's not to play here.","Let's don't play here."],"a":0,"e":"Let's 的否定：Let's not + 原形。"},{"s":"英文","r":"U4","q":"Listen! Someone ____ in the next room.","o":["sings","is singing","are singing","sing"],"a":1,"e":"Listen! 表示正在發生；someone 視為單數 → is singing。"},{"s":"英文","r":"U3","q":"A: ____ he swim?\nB: Yes, he can.","o":["Does","Do","Is","Can"],"a":3,"e":"回答用 he can，問句用 Can 開頭。"},{"s":"英文","r":"U4","q":"「下午 3:30」的英文寫法是哪一個？","o":["15:30 p.m.","3:30 a.m.","p.m. 3:30","3:30 p.m."],"a":3,"e":"下午用 p.m.，寫在時間後面。"},{"s":"英文","r":"U4","q":"Today is Wednesday. The day after today is ____.","o":["Monday","Thursday","Friday","Tuesday"],"a":1,"e":"星期三的後一天是星期四 Thursday。"},{"s":"英文","r":"U4","q":"Look! The birds ____ in the sky.","o":["are flying","fly","is flying","flies"],"a":0,"e":"Look! 表示正在進行；the birds 是複數 → are flying。"},{"s":"英文","r":"U3","q":"This is my sister. I love ____ very much.","o":["she","herself","hers","her"],"a":3,"e":"love 後接受格；she 的受格是 her。"},{"s":"英文","r":"Review 2","q":"There are thirty students in Class 7. Today is Monday, and it's ten o'clock. The students are in the music room. They are singing.\n\nQ: What are the students doing now?","o":["It's Monday.","They are in Class 8.","They are reading.","They are singing."],"a":3,"e":"文中最後一句：They are singing."},{"s":"數學","r":"2-2","q":"一個大於 1 的數除以 4、6、9 都餘 1，這個數最小是多少？","o":["37","35","73","36"],"a":0,"e":"4、6、9 的最小公倍數是 36，再加餘數 1：37。"},{"s":"數學","r":"2-2","q":"A = 2³ × 3² × 5，B = 2² × 3³ × 7，A 和 B 的最大公因數是多少？","o":["2² × 3² × 5 × 7","12","2³ × 3³","36"],"a":3,"e":"最大公因數取共同的質因數、次方小的：2² × 3² = 36。"},{"s":"數學","r":"2-2","q":"a = 2² × 3 × 5，b = 2 × 3² × 7，a 和 b 的最小公倍數是哪一個？","o":["2² × 3² × 5 × 7","2³ × 3³ × 5 × 7","2² × 3 × 5 × 7","2 × 3"],"a":0,"e":"最小公倍數取所有質因數、次方大的：2² × 3² × 5 × 7。"},{"s":"數學","r":"2-4","q":"計算：(−1/2)³ × (−4)² = ？","o":["−2","2","−8","8"],"a":0,"e":"(−1/2)³ = −1/8，(−4)² = 16，−1/8 × 16 = −2。"},{"s":"數學","r":"2-4","q":"計算：[(−2)³]² ÷ (−2)⁴ = ？","o":["−16","4","16","−4"],"a":1,"e":"[(−2)³]² = (−2)⁶，(−2)⁶ ÷ (−2)⁴ = (−2)² = 4。"},{"s":"數學","r":"2-3","q":"計算：1 − (1/2 − 1/3) ÷ 1/6 = ？","o":["0","−1","5/6","1"],"a":0,"e":"括號先算：1/2 − 1/3 = 1/6；1/6 ÷ 1/6 = 1；1 − 1 = 0。"},{"s":"數學","r":"2-3","q":"計算：−3/4 − (−5/6) + (−1/3) = ？","o":["−1/12","−1/4","1/4","−7/12"],"a":1,"e":"通分成 12：−9/12 + 10/12 − 4/12 = −3/12 = −1/4。"},{"s":"數學","r":"2-4","q":"n 是正整數，下列哪一個式子「一定」正確？","o":["(−1)ⁿ = 1","(−1)²ⁿ⁺¹ = 1","(−1)²ⁿ = −1","(−1)²ⁿ = 1"],"a":3,"e":"2n 一定是偶數，−1 的偶數次方是 1；2n+1 是奇數，結果是 −1。"},{"s":"數學","r":"2-2","q":"用大小相同的正方體積木，剛好填滿長 12、寬 18、高 30 公分的箱子。積木要盡量大，最少需要幾塊？","o":["6","6480","180","30"],"a":3,"e":"邊長取 12、18、30 的最大公因數 6；(12÷6)×(18÷6)×(30÷6) = 2×3×5 = 30 塊。"},{"s":"數學","r":"2-2","q":"甲、乙、丙三盞燈分別每 6 秒、8 秒、10 秒閃一次。三盞燈同時閃一次後，接下來的 3 分鐘內還會再同時閃幾次？","o":["3 次","1 次","2 次","0 次"],"a":1,"e":"6、8、10 的最小公倍數是 120 秒。3 分鐘 = 180 秒，只有第 120 秒會同時閃，共 1 次。"},{"s":"生物","r":"2-3","q":"遮光實驗中，照光部分有澱粉、遮光部分沒有澱粉，可以推論出什麼？","o":["光合作用需要光","光合作用會產生氧氣","光合作用需要水","光合作用需要二氧化碳"],"a":0,"e":"唯一不同的變因是「有沒有照光」，所以可推論光合作用需要光。"},{"s":"生物","r":"2-3","q":"光合作用實驗前，要先把植物放在暗處一天，目的是什麼？","o":["讓葉片原有的澱粉消耗掉","讓葉綠素變多","讓氣孔關閉","讓植物休息"],"a":0,"e":"先消耗掉原有澱粉，才能確定實驗後的澱粉是照光時新產生的。"},{"s":"生物","r":"2-4","q":"下列哪一項屬於「化學性消化」？","o":["牙齒咀嚼食物","唾液中的酵素把澱粉分解","膽汁使脂肪乳化","胃的蠕動"],"a":1,"e":"化學性消化要靠酵素改變物質成分。咀嚼、蠕動、乳化只是變小或混合，屬於物理性消化。"},{"s":"生物","r":"2-4","q":"下列「養分 → 最後分解成的小分子」配對，哪一項「錯誤」？","o":["澱粉 → 葡萄糖","蛋白質 → 葡萄糖","脂質 → 脂肪酸和甘油","蛋白質 → 胺基酸"],"a":1,"e":"蛋白質最後分解成胺基酸，不是葡萄糖。"},{"s":"生物","r":"3-1～3-2","q":"蒸散作用對植物的好處「不包括」下列哪一項？","o":["降低葉片溫度","直接製造葡萄糖","幫助水分向上運輸","幫助礦物質向上運送"],"a":1,"e":"製造葡萄糖是光合作用；蒸散作用產生拉力，幫助水分和礦物質上升，也能降溫。"},{"s":"生物","r":"3-3","q":"從手臂靜脈注射藥物後，藥物最先到達心臟的哪一個腔室？","o":["左心房","右心房","左心室","右心室"],"a":1,"e":"靜脈血經大靜脈回到右心房，再到右心室、肺動脈。"},{"s":"生物","r":"3-3","q":"關於「體循環」的路徑，哪一項正確？","o":["從右心室出發，回到左心房","從右心房出發，回到左心室","從左心室出發，回到右心房","從左心房出發，回到右心室"],"a":2,"e":"體循環：左心室 → 主動脈 → 全身 → 大靜脈 → 右心房。"},{"s":"生物","r":"3-3","q":"關於微血管的敘述，哪一項「錯誤」？","o":["是物質交換的場所","管壁最厚，而且有瓣膜","管壁只有一層細胞","血流速度最慢"],"a":1,"e":"管壁最厚的是動脈；有瓣膜的是靜脈。微血管管壁最薄。"},{"s":"生物","r":"3-4","q":"皮膚受傷後紅、腫、熱、痛，白血球聚集吞噬細菌，這屬於第幾道防線？","o":["不屬於防線","第三道防線","第一道防線","第二道防線"],"a":3,"e":"發炎反應、白血球吞噬屬於第二道防線；第三道是產生抗體的專一性防禦。"},{"s":"生物","r":"3-4","q":"被毒蛇咬傷後要立刻注射抗蛇毒血清，原因是什麼？","o":["血清可以讓身體慢慢產生抗體","血清中已含有抗體，可以立即中和毒素","血清能增加紅血球","血清會讓傷口變小"],"a":1,"e":"血清直接提供現成抗體，作用快但效果不持久；疫苗則是讓身體自己產生抗體。"}]},{"no":"英文","lv":"挑戰","grp":"單科挑戰卷","ver":"段考2-英文挑戰","desc":"U3～Review 2｜單字填寫 20、句型 10、文法 10","secs":[{"k":"單字","c":"var(--c2)"},{"k":"句型","c":"var(--c1)"},{"k":"文法","c":"var(--c3)"}],"Q":[{"s":"單字","r":"U3","t":"fill","q":"安靜的（adj.）\nPlease be q______ in the library.","ans":["quiet"],"e":"quiet 安靜的。注意不要和 quite（相當）搞混。"},{"s":"單字","r":"U3","t":"fill","q":"危險的（adj.）\nDon't touch it. It's d________.","ans":["dangerous"],"e":"dangerous 危險的。"},{"s":"單字","r":"U3","t":"fill","q":"小心的（adj.）\nBe c______! The floor is wet.","ans":["careful"],"e":"careful 小心的；Be careful! 小心！"},{"s":"單字","r":"U3","t":"fill","q":"關上（v.）\nIt's cold. Please c____ the window.","ans":["close","shut"],"e":"close 關上（反義：open 打開）。"},{"s":"單字","r":"U3","t":"fill","q":"照片（n. 複數）\nDon't take p_______ in the museum.","ans":["pictures","photos"],"e":"take pictures 拍照。"},{"s":"單字","r":"U3","t":"fill","q":"野餐（n.）\nLet's go on a p_____ in the park this Sunday.","ans":["picnic"],"e":"go on a picnic 去野餐。"},{"s":"單字","r":"U3","t":"fill","q":"規則（n. 複數）\nPlease follow the r____ in the lab.","ans":["rules"],"e":"rule 規則；the rules 用複數。"},{"s":"單字","r":"U3","t":"fill","q":"游泳（V-ing）\nLet's go s_______ in the sea.","ans":["swimming"],"e":"go + V-ing：go swimming。swim 要重複 m 再加 ing。"},{"s":"單字","r":"U3","t":"fill","q":"魔法的（adj.）\nOpen the m____ door!","ans":["magic"],"e":"magic 魔法的、神奇的。"},{"s":"單字","r":"U4","t":"fill","q":"音樂會（n.）\nWhat time is the c______? It's at 7 p.m.","ans":["concert"],"e":"concert 音樂會、演唱會。"},{"s":"單字","r":"U4","t":"fill","q":"最喜愛的（adj.）\nWho's your f_______ singer?","ans":["favorite","favourite"],"e":"favorite（英式 favourite）最喜愛的。"},{"s":"單字","r":"U4","t":"fill","q":"爵士樂（n.）\nMy dad likes j___ music.","ans":["jazz"],"e":"jazz 爵士樂。"},{"s":"單字","r":"U4","t":"fill","q":"樂團（n.）\nWhich b___ do you like?","ans":["band"],"e":"band 樂團。"},{"s":"單字","r":"U4","t":"fill","q":"歌迷（n. 複數）\nMany f___ are waiting for the singer.","ans":["fans"],"e":"fan 歌迷、粉絲，複數 fans。"},{"s":"單字","r":"U4","t":"fill","q":"握手：shake h____\nThe singer is shaking h____ with her fans.","ans":["hands"],"e":"shake hands 握手，hand 要用複數。"},{"s":"單字","r":"U4","t":"fill","q":"星期三（n.）\nW________ comes after Tuesday.","ans":["wednesday"],"e":"Wednesday 星期三，注意中間的 d 不發音，容易漏寫。"},{"s":"單字","r":"U4","t":"fill","q":"星期四（n.）\nT_______ is the day before Friday.","ans":["thursday"],"e":"Thursday 星期四。Tuesday 是星期二。"},{"s":"單字","r":"U4","t":"fill","q":"週末（n.）\nSaturday and Sunday are the w______.","ans":["weekend"],"e":"weekend 週末。"},{"s":"單字","r":"U4","t":"fill","q":"操場、遊樂場（n.）\nThe kids are playing on the p_________.","ans":["playground"],"e":"playground = play + ground（複合名詞）。"},{"s":"單字","r":"U4","t":"fill","q":"書包（n.）\nPut your books in your s________.","ans":["schoolbag"],"e":"schoolbag = school + bag（複合名詞）。"},{"s":"句型","r":"U3","q":"A: Let's go to the movies tonight.\nB: ____ I have to do my homework.","o":["Yes, I am.","Sure. Let's do it.","You're welcome.","Sorry, maybe next time."],"a":3,"e":"後面說要寫作業，所以是婉拒：Sorry, maybe next time."},{"s":"句型","r":"U3","q":"A: Can I open the window?\nB: ____ It's hot in here.","o":["Sure. Go ahead.","Yes, I can open.","Let's not.","No, you aren't."],"a":0,"e":"對方徵求同意，答應可說 Sure. / Go ahead.；後面說很熱，表示同意。"},{"s":"句型","r":"U3","q":"下列哪一個句子「正確」？","o":["Don't let's playing in the street.","Let's not to play in the street.","Let's don't play in the street.","Let's not play in the street."],"a":3,"e":"Let's 的否定：Let's not + 原形動詞。"},{"s":"句型","r":"U3","q":"把 \"You can't eat in the lab.\" 改成祈使句，哪一個正確？","o":["No eating the lab.","Doesn't eat in the lab.","Not eat in the lab.","Don't eat in the lab."],"a":3,"e":"否定祈使句：Don't + 原形動詞。"},{"s":"句型","r":"U4","q":"A: What time is the concert?\nB: ____","o":["It's in the park.","It's at 7:30 p.m.","It's jazz.","It's on Friday."],"a":1,"e":"What time 問幾點，回答 at + 時間。on Friday 回答 What day。"},{"s":"句型","r":"U4","q":"A: What day is the concert?\nB: It's ____ Saturday.","o":["in","at","on","of"],"a":2,"e":"星期前面用 on；時間點用 at。"},{"s":"句型","r":"U4","q":"A: What are you doing?\nB: ____","o":["I like reading.","Yes, I am.","I read a comic book.","I'm reading a comic book."],"a":3,"e":"問「正在做什麼」，回答現在進行式 I'm + V-ing。"},{"s":"句型","r":"U4","q":"A: Is your brother sleeping?\nB: ____ He's playing the guitar.","o":["Yes, he does.","No, he doesn't.","No, he isn't.","Yes, he is."],"a":2,"e":"後面說他在彈吉他，所以否定；Is 問句 → No, he isn't."},{"s":"句型","r":"U4","q":"「下午 3:30」的正確英文說法是哪一個？","o":["It's p.m. three thirty.","It's three thirty a.m.","It's three thirty p.m.","It's thirty three p.m."],"a":2,"e":"a.m. 上午、p.m. 下午；時間寫在前面，a.m./p.m. 放在後面。"},{"s":"句型","r":"U4","q":"A: Which kind of music do you like?\nB: ____","o":["I'm a fan.","Yes, I do.","I like rock and roll.","It's at 8 p.m."],"a":2,"e":"Which kind of music 問喜歡哪一種音樂，要回答音樂類型。"},{"s":"文法","r":"U4","q":"下列哪一個 V-ing 的拼法「正確」？","o":["lyeing","liing","lying","lieing"],"a":2,"e":"ie 結尾的動詞，改 ie 為 y 再加 ing：lie → lying、die → dying。"},{"s":"文法","r":"U4","q":"下列哪一個 V-ing 的拼法「錯誤」？","o":["running","writing","dancing","swiming"],"a":3,"e":"swim → swimming（短母音＋單一子音，重複字尾）。"},{"s":"文法","r":"U3","q":"Mom is very busy now. Let's help ____.","o":["she","hers","herself","her"],"a":3,"e":"help 後接受格；she 的受格是 her。"},{"s":"文法","r":"U4","q":"Look! Ben and his dog ____ in the park.","o":["is running","run","runs","are running"],"a":3,"e":"Ben and his dog 是複數，現在進行式用 are running。"},{"s":"文法","r":"U3","q":"____ quiet and ____ run in the hallway.","o":["Are / no","Being / don't","Is / not","Be / don't"],"a":3,"e":"祈使句：Be quiet（原形 be），否定 don't run。"},{"s":"文法","r":"U4","q":"Listen! Somebody ____ the piano.","o":["play","is playing","plays","are playing"],"a":1,"e":"Listen! 表示正在發生；somebody 視為單數 → is playing。"},{"s":"文法","r":"U3","q":"Can you show ____ your new phone?","o":["me","I","my","mine"],"a":0,"e":"show 後接受格 me（show sb. sth.）。"},{"s":"文法","r":"U4","q":"What ____ Tina and Kevin doing now?","o":["are","is","do","does"],"a":0,"e":"Tina and Kevin 是複數 → What are … doing？"},{"s":"文法","r":"U3","q":"下列哪一個句子「正確」？","o":["Don't touching the paintings.","Doesn't touch the paintings.","Please don't touch the paintings.","Please not touch the paintings."],"a":2,"e":"Please + 否定祈使句：Please don't + 原形。"},{"s":"文法","r":"U4","q":"Dad is in the living room now. He ____ the newspaper.","o":["are reading","is reading","reads","read"],"a":1,"e":"now 表示正在進行；He → is reading。"}]},{"no":"社會","lv":"挑戰","grp":"單科挑戰卷","ver":"段考2-社會挑戰","desc":"歷史 L3～L4 20 題、公民 L3～L4 20 題","secs":[{"k":"歷史","c":"var(--c1)"},{"k":"公民","c":"var(--c4)"}],"Q":[{"s":"歷史","r":"歷 L3","q":"荷蘭人在臺灣南部的統治中心「大員」，建了哪一座城堡？","o":["聖多明哥城","億載金城","聖薩爾瓦多城","熱蘭遮城"],"a":3,"e":"荷蘭人在大員（今臺南安平）建熱蘭遮城。聖薩爾瓦多城、聖多明哥城是西班牙人在北部所建。"},{"s":"歷史","r":"歷 L3","q":"西班牙人佔領臺灣北部時，主要的據點在哪裡？","o":["鹿港、彰化","雞籠、淡水","宜蘭、花蓮","臺南、高雄"],"a":1,"e":"西班牙人在雞籠（基隆）建聖薩爾瓦多城，在淡水建聖多明哥城。"},{"s":"歷史","r":"歷 L3","q":"荷蘭傳教士用羅馬字拼寫西拉雅語，後來原住民用這種文字書寫土地契約，稱為什麼？","o":["新港文書","番大租","漢文書信","契字公文"],"a":0,"e":"新港文書是用羅馬拼音書寫的西拉雅語契約，荷蘭人離開後仍使用了很久。"},{"s":"歷史","r":"歷 L3","q":"荷蘭人召集各社長老、授予權杖，要他們表示效忠，這是哪一種治理方式？","o":["保甲制度","渡臺禁令","科舉考試","地方會議"],"a":3,"e":"荷蘭人透過地方會議管理原住民各社，長老接受權杖代表服從。"},{"s":"歷史","r":"歷 L3","q":"荷蘭時期，原住民大量捕鹿、輸出鹿皮，最可能帶來什麼影響？","o":["鹿群數量大減","鹿皮價格不斷下降","臺灣森林增加","原住民人口大增"],"a":0,"e":"鹿皮大量輸出到日本，過度捕獵使鹿群減少，改變原住民生活。"},{"s":"歷史","r":"歷 L3","q":"西班牙人在臺灣北部，對原住民最主要的影響是什麼？","o":["實施渡臺禁令","傳播天主教","推行科舉","建立鐵路"],"a":1,"e":"西班牙傳教士在北部傳播天主教，是他們對原住民的主要影響。"},{"s":"歷史","r":"歷 L3","q":"鄭氏政權在臺灣實施屯田，與中部哪一個原住民勢力發生衝突？","o":["大肚王","林爽文","牡丹社","郭懷一"],"a":0,"e":"鄭氏軍隊屯墾侵入原住民土地，與中部的大肚王（拍瀑拉族）發生衝突。"},{"s":"歷史","r":"歷 L3","q":"鄭氏政權推行屯田（軍隊開墾），對原住民最大的影響是什麼？","o":["原住民學會製糖","原住民開始使用羅馬字","原住民改信天主教","原住民土地被佔用"],"a":3,"e":"屯田使漢人勢力擴張，原住民的生活空間與土地受到壓縮。"},{"s":"歷史","r":"歷 L3","q":"下列有關大航海時代外來者的敘述，哪一項正確？","o":["西班牙人把荷蘭人趕出臺灣","荷蘭人和西班牙人都只在南部活動","鄭成功先趕走西班牙人","荷蘭人把西班牙人趕出北部臺灣"],"a":3,"e":"1642 年荷蘭人北上驅逐西班牙人；1662 年鄭成功再驅逐荷蘭人。"},{"s":"歷史","r":"歷 L3","q":"大航海時代，外來者對臺灣原住民的影響，「不包括」下列哪一項？","o":["宗教信仰改變","土地逐漸流失","建立臺灣省政府","引進文字書寫"],"a":2,"e":"臺灣建省是清末（1885 年）的事，與大航海時代無關。"},{"s":"歷史","r":"歷 L4","q":"清帝國在 1684 年把臺灣納入版圖後，設立了哪些行政區？","o":["一府三縣","三府一州","臺灣省","二府八縣"],"a":0,"e":"設臺灣府，隸屬福建省，下轄臺灣、鳳山、諸羅三縣。"},{"s":"歷史","r":"歷 L4","q":"清初的「渡臺禁令」主要內容是什麼？","o":["來臺要申請許可，且不准攜帶家眷","禁止外國人經商","禁止原住民出海","鼓勵大量漢人移民"],"a":0,"e":"清初限制移民：要申請照單、不准攜眷，避免臺灣再成為反清基地。"},{"s":"歷史","r":"歷 L4","q":"清初在漢人與原住民之間立石、挖溝為界（土牛溝），稱為什麼政策？","o":["建省","開山撫番","劃界封山","清賦"],"a":2,"e":"劃界封山：禁止漢人越界進入原住民地區，減少衝突、方便管理。"},{"s":"歷史","r":"歷 L4","q":"清初治理臺灣的態度，最適合用哪一句話形容？","o":["以臺灣為工業中心","為防臺而治臺","積極建設","全面開放移民"],"a":1,"e":"清初擔心臺灣成為反抗基地，治臺偏向消極、防範。"},{"s":"歷史","r":"歷 L4","q":"1874 年牡丹社事件後，清廷派誰來臺處理，並推動「開山撫番」？","o":["鄭成功","沈葆楨","劉銘傳","施琅"],"a":1,"e":"沈葆楨來臺加強防務，開闢通往後山的道路（開山撫番），並解除渡臺禁令。"},{"s":"歷史","r":"歷 L4","q":"沈葆楨在臺南安平興建的西式砲臺是哪一座？","o":["聖多明哥城","熱蘭遮城","普羅民遮城","億載金城"],"a":3,"e":"億載金城（二鯤鯓砲臺）是沈葆楨所建的西式砲臺。"},{"s":"歷史","r":"歷 L4","q":"臺灣在哪一場戰爭後，於 1885 年正式建省？","o":["牡丹社事件","清法戰爭","甲午戰爭","鴉片戰爭"],"a":1,"e":"清法戰爭中法軍攻打臺灣，清廷體認臺灣的重要，1885 年臺灣建省。"},{"s":"歷史","r":"歷 L4","q":"臺灣建省後的首任巡撫是誰？","o":["劉銘傳","沈葆楨","丁日昌","施琅"],"a":0,"e":"劉銘傳為首任臺灣巡撫，推動多項新式建設。"},{"s":"歷史","r":"歷 L4","q":"下列哪一項「不是」劉銘傳在臺灣的建設？","o":["設立郵政","架設電報","興建鐵路","興建熱蘭遮城"],"a":3,"e":"熱蘭遮城是荷蘭人所建。劉銘傳興建基隆到新竹的鐵路、設郵政、架電報。"},{"s":"歷史","r":"歷 L4","q":"清廷治臺政策從消極轉為積極，最主要的原因是什麼？","o":["臺灣人口減少","外國勢力侵擾，臺灣戰略地位受重視","原住民要求建省","荷蘭人回到臺灣"],"a":1,"e":"牡丹社事件、清法戰爭等外力侵擾，讓清廷改採積極建設。"},{"s":"公民","r":"公 L3","q":"依照民法，「媽媽的哥哥（舅舅）」對你來說是哪一種親屬？","o":["血親","配偶","姻親","沒有親屬關係"],"a":0,"e":"舅舅和你有血緣關係（媽媽的兄弟），是旁系血親。"},{"s":"公民","r":"公 L3","q":"依照民法，「舅舅的太太（舅媽）」對你來說是哪一種親屬？","o":["姻親","血親","配偶","法定血親"],"a":0,"e":"舅媽是「血親的配偶」，因婚姻而產生，屬於姻親。"},{"s":"公民","r":"公 L3","q":"被合法收養的養子女，和養父母之間屬於哪一種親屬關係？","o":["自然血親","法定血親","配偶","姻親"],"a":1,"e":"因收養而產生的血親關係，稱為法定血親（擬制血親）。"},{"s":"公民","r":"公 L3","q":"下列哪一位和你屬於「直系血親」？","o":["哥哥","祖父","表姊","叔叔"],"a":1,"e":"直系血親是上下一直線的關係：祖父母、父母、子女、孫子女。兄弟姊妹、叔伯是旁系血親。"},{"s":"公民","r":"公 L3","q":"父母對未成年子女行使親權時，最重要的原則是什麼？","o":["學校的規定","子女的最佳利益","父母的方便","祖父母的意見"],"a":1,"e":"民法規定親權的行使要以子女最佳利益為原則。"},{"s":"公民","r":"公 L3","q":"依照現行民法，子女的姓氏如何決定？","o":["由戶政人員決定","一定從父姓","父母在出生登記前書面約定從父姓或母姓","一定從母姓"],"a":2,"e":"父母於出生登記前以書面約定；約定不成時，由戶政機關抽籤決定。"},{"s":"公民","r":"公 L3","q":"依照現行民法，幾歲為成年？","o":["20 歲","22 歲","16 歲","18 歲"],"a":3,"e":"民法修正後，2023 年起成年年齡由 20 歲下修為 18 歲。"},{"s":"公民","r":"公 L3","q":"關於夫妻的權利義務，下列哪一項正確？","o":["住所一律由丈夫決定","家庭生活費用只能由丈夫負擔","家庭生活費用由夫妻依經濟能力、家事勞動等分擔","妻子必須冠夫姓"],"a":2,"e":"民法規定住所由雙方協議；生活費用依經濟能力、家事勞動等分擔；冠姓與否可自由約定。"},{"s":"公民","r":"公 L3","q":"「男主外、女主內」的家務分工觀念，可能造成什麼問題？","o":["男性比較會做家事","家務勞動分配不平等","家人一定更和諧","女性不能工作違法"],"a":1,"e":"把家務都推給女性，會造成負擔不均，屬於性別刻板印象。"},{"s":"公民","r":"公 L3","q":"爸媽年紀大了，需要照顧，依法子女應負起什麼責任？","o":["扶養義務","只要探望即可","由政府全部負責","沒有任何責任"],"a":0,"e":"直系血親之間互負扶養義務，子女有扶養年老父母的責任。"},{"s":"公民","r":"公 L4","q":"夫妻兩人都有工作、但選擇不生育子女的家庭，稱為什麼？","o":["重組家庭","頂客族","單親家庭","隔代教養家庭"],"a":1,"e":"頂客族（DINK）：雙薪、無子女。"},{"s":"公民","r":"公 L4","q":"父母在外地工作，孩子由祖父母照顧長大，屬於哪一種家庭型態？","o":["隔代教養家庭","頂客族","跨國婚姻家庭","重組家庭"],"a":0,"e":"由祖父母代替父母照顧、教養孫子女，稱為隔代教養。"},{"s":"公民","r":"公 L4","q":"爸爸到外縣市或國外工作，與家人分住兩地，屬於哪一種家庭型態？","o":["單親家庭","頂客族","重組家庭","兩地家庭"],"a":3,"e":"家人因工作等原因長期分居兩地，稱為兩地家庭。"},{"s":"公民","r":"公 L4","q":"父母離婚後，其中一方再婚，與新配偶及雙方子女組成的家庭，稱為什麼？","o":["重組家庭","核心家庭","隔代教養家庭","單親家庭"],"a":0,"e":"再婚後組成的新家庭稱為重組家庭。"},{"s":"公民","r":"公 L4","q":"過去家庭負責教育子女，現在多由學校負責，這是家庭哪一項功能的變遷？","o":["保護照顧功能","生育功能","教育功能","經濟功能"],"a":2,"e":"學校分擔了家庭的教育功能。"},{"s":"公民","r":"公 L4","q":"托嬰中心、安養機構、長期照顧服務的出現，分擔了家庭的哪一項功能？","o":["宗教功能","教育功能","保護照顧功能","生育功能"],"a":2,"e":"照顧幼兒、老人原本是家庭的保護照顧功能，現在部分由社會機構分擔。"},{"s":"公民","r":"公 L4","q":"下列哪一項「不是」政府因應少子化的措施？","o":["發放育兒津貼","增加公共托育","延後退休年齡","推動育嬰留職停薪"],"a":2,"e":"延後退休年齡主要與高齡化、勞動力有關；其他三項是鼓勵生育、減輕養育負擔。"},{"s":"公民","r":"公 L4","q":"65 歲以上人口超過總人口的 20%，稱為什麼社會？","o":["高齡化社會","超高齡社會","少子化社會","高齡社會"],"a":1,"e":"7% 高齡化社會、14% 高齡社會、20% 超高齡社會。"},{"s":"公民","r":"公 L4","q":"遭受家庭暴力時，可以向法院聲請什麼來保護自己？","o":["身分證","結婚證書","畢業證書","保護令"],"a":3,"e":"依《家庭暴力防治法》，被害人可向法院聲請保護令。"},{"s":"公民","r":"公 L4","q":"依照《家庭暴力防治法》，下列哪一種情形「也」屬於家庭暴力？","o":["父母要求孩子寫功課","兄弟姊妹一起做家事","家人一起出遊","家人經常辱罵、恐嚇，造成精神上的傷害"],"a":3,"e":"家庭暴力包括身體、精神或經濟上的騷擾、控制、脅迫等不法侵害，不只是打人。"}]},{"no":"地理","lv":"挑戰","grp":"單科挑戰卷","ver":"段考2-地理挑戰","desc":"L3 地形 20 題、L4 海岸與島嶼 20 題","secs":[{"k":"地形","c":"var(--c3)"},{"k":"海岸與島嶼","c":"var(--c2)"}],"Q":[{"s":"地形","r":"L3 地形","q":"下列哪一項屬於「外營力」作用？","o":["河流侵蝕形成峽谷","板塊擠壓使山脈隆起","地震造成地層錯動","火山噴發形成火山"],"a":0,"e":"外營力（風化、侵蝕、搬運、堆積）來自地表外部，會使地表趨於平坦；板塊、火山、地震屬於內營力。"},{"s":"地形","r":"L3 地形","q":"內營力和外營力對地表起伏的影響，哪一項正確？","o":["兩者都使地表起伏變大","兩者都使地表變平坦","內營力使地表變平坦，外營力使起伏變大","內營力使地表起伏變大，外營力使地表趨於平坦"],"a":3,"e":"內營力造山、使高低差變大；外營力把高處削低、低處填平。"},{"s":"地形","r":"L3 地形","q":"臺灣多地震、多高山，主要是因為位在哪兩個板塊的交界？","o":["歐亞板塊與菲律賓海板塊","太平洋板塊與北美板塊","印澳板塊與歐亞板塊","非洲板塊與歐亞板塊"],"a":0,"e":"臺灣位於歐亞板塊與菲律賓海板塊的交界，板塊擠壓造成造山運動與地震。"},{"s":"地形","r":"L3 地形","q":"「四周高、中間低」的地形稱為什麼？","o":["盆地","丘陵","平原","台地"],"a":0,"e":"盆地四周被山地或丘陵包圍，中間低平，例如臺北盆地。"},{"s":"地形","r":"L3 地形","q":"「頂部平坦、四周是陡坡，高於周圍地區」的地形稱為什麼？","o":["盆地","平原","山地","台地"],"a":3,"e":"台地像一張桌子，頂部平、邊緣陡，例如林口台地、桃園台地。"},{"s":"地形","r":"L3 地形","q":"臺灣最高峰玉山主峰位在哪一條山脈？","o":["阿里山山脈","雪山山脈","中央山脈","玉山山脈"],"a":3,"e":"玉山主峰屬於玉山山脈，是臺灣最高峰（約 3952 公尺）。"},{"s":"地形","r":"L3 地形","q":"臺灣五大山脈中，哪一條位在花東縱谷的「東側」？","o":["雪山山脈","阿里山山脈","海岸山脈","中央山脈"],"a":2,"e":"海岸山脈在花東縱谷東側、臨太平洋；中央山脈在縱谷西側。"},{"s":"地形","r":"L3 地形","q":"臺灣面積最大的平原是哪一個？","o":["嘉南平原","屏東平原","蘭陽平原","花東縱谷平原"],"a":0,"e":"嘉南平原是臺灣最大的平原，也是重要的農業區。"},{"s":"地形","r":"L3 地形","q":"形狀接近三角形、由蘭陽溪沖積而成的平原是哪一個？","o":["蘭陽平原","臺北盆地","嘉南平原","屏東平原"],"a":0,"e":"蘭陽平原位於宜蘭，由蘭陽溪沖積，形狀像三角形。"},{"s":"地形","r":"L3 地形","q":"人類活動和城市大多集中在平原，原因「不包括」下列哪一項？","o":["土壤肥沃、容易灌溉","建築容易、開發成本低","地勢高，可以避免颱風","地勢平坦，交通方便"],"a":2,"e":"平原地勢低平，不是因為地勢高；颱風也不會因地勢高就避開。"},{"s":"地形","r":"L3 地形","q":"在等高線地形圖上，等高線越「密集」的地方，表示什麼？","o":["一定是山頂","坡度越平緩","坡度越陡","海拔越低"],"a":2,"e":"等高線越密，表示很短的水平距離內高度變化很大，坡度陡。"},{"s":"地形","r":"L3 地形","q":"等高線呈 V 字形，且 V 字的尖端指向「高處」，代表哪一種地形？","o":["山頂","山脊","鞍部","山谷（河谷）"],"a":3,"e":"V 字尖端指向高處是河谷（溪流常在此）；指向低處則是山脊。"},{"s":"地形","r":"L3 地形","q":"用不同顏色代表不同高度（例如綠色低、褐色高）的地圖，稱為什麼？","o":["分層設色圖","地形剖面圖","航空照片","等高線地形圖"],"a":0,"e":"分層設色圖以顏色深淺表示海拔高低，一眼就能看出地勢。"},{"s":"地形","r":"L3 地形","q":"想知道「從臺中沿直線到花蓮」一路上的高低起伏，最適合用哪一種圖？","o":["地形剖面圖","分層設色圖","行政區域圖","衛星影像"],"a":0,"e":"地形剖面圖可以呈現沿著某條線的地勢高低變化。"},{"s":"地形","r":"L3 地形","q":"桃園台地上有許多「埤塘」，最主要的原因是什麼？","o":["用來防止地震","為了發展觀光","用來養殖海水魚","台地地勢較高、河川短，取水不易，需要蓄水灌溉"],"a":3,"e":"桃園台地地勢高、河川短小，水源不足，早期挖埤塘儲水灌溉農田。"},{"s":"地形","r":"L3 地形","q":"太魯閣峽谷陡峭的峽谷景觀，主要是由哪一種作用造成的？","o":["河流向下侵蝕","冰河堆積","火山噴發","風力堆積"],"a":0,"e":"立霧溪強烈向下侵蝕堅硬的大理岩，形成深而陡的峽谷。"},{"s":"地形","r":"L3 地形","q":"臺灣北部的大屯火山群屬於哪一種地形成因？","o":["外營力堆積","內營力（火山作用）","風力侵蝕","海浪堆積"],"a":1,"e":"火山是地球內部岩漿活動造成，屬於內營力。"},{"s":"地形","r":"L3 地形","q":"臺灣山地和丘陵約占全島面積的多少？","o":["約一半","約三分之一","約十分之一","約三分之二"],"a":3,"e":"臺灣山多平原少，山地和丘陵約占三分之二，平原面積較小。"},{"s":"地形","r":"L3 地形","q":"臺灣的台地多分布在哪裡，頂部常覆蓋什麼土壤？","o":["北部，冰河土","南部，沙土","西部，紅土","東部，黑土"],"a":2,"e":"臺灣的台地（林口、桃園、大肚、八卦等）多在西部，頂部常有紅土。"},{"s":"地形","r":"L3 地形","q":"中部有好幾個小盆地聚集在一起，被稱為「盆地群」，是哪一個？","o":["埔里盆地群","泰源盆地","臺北盆地","臺中盆地"],"a":0,"e":"埔里盆地群由多個小盆地組成，位於南投。"},{"s":"海岸與島嶼","r":"L4 海岸與島嶼","q":"海岸線平直、多沙灘，常見潟湖和沙洲的是哪一種海岸？","o":["斷層海岸","沙岸","珊瑚礁海岸","岩岸"],"a":1,"e":"河川帶來大量泥沙堆積，形成平直的沙岸，常見潟湖、沙洲。"},{"s":"海岸與島嶼","r":"L4 海岸與島嶼","q":"臺灣西部海岸以沙岸為主，主要原因是什麼？","o":["西部河川多，帶來大量泥沙堆積","西部有很多火山","西部珊瑚多","西部海水很深"],"a":0,"e":"西部河川流經平原，攜帶大量泥沙在海岸堆積，形成沙岸。"},{"s":"海岸與島嶼","r":"L4 海岸與島嶼","q":"臺灣北部海岸岬角與海灣交錯，主要原因是什麼？","o":["珊瑚生長","泥沙堆積","岩層軟硬不同，海浪差別侵蝕","斷層作用"],"a":2,"e":"硬岩較耐侵蝕形成岬角，軟岩被侵蝕形成海灣，稱為岬灣海岸。"},{"s":"海岸與島嶼","r":"L4 海岸與島嶼","q":"野柳的「女王頭」屬於哪一種海岸景觀？","o":["岩岸的海蝕地形（蕈狀岩）","珊瑚礁","潟湖","沙岸的沙丘"],"a":0,"e":"女王頭是海浪、風化侵蝕形成的蕈狀岩，屬於北部岩岸的海蝕地形。"},{"s":"海岸與島嶼","r":"L4 海岸與島嶼","q":"珊瑚生長需要的環境條件，「不包括」下列哪一項？","o":["淺海、陽光充足","海水溫暖","海水混濁、泥沙多","海水清澈"],"a":2,"e":"珊瑚需要溫暖、清澈、淺而陽光充足的海水；泥沙多會讓珊瑚死亡。"},{"s":"海岸與島嶼","r":"L4 海岸與島嶼","q":"臺灣的珊瑚礁海岸主要分布在哪裡？","o":["東北角","南部恆春半島","西部","北部"],"a":1,"e":"恆春半島（墾丁一帶）緯度低、海水溫暖，珊瑚礁海岸發達。"},{"s":"海岸與島嶼","r":"L4 海岸與島嶼","q":"臺 function jsonp(params){

    const cb='__g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const s=document.createElement('script');
    const done=()=>{clearTimeout(tm);try{delete window[cb];}catch(_){window[cb]=undefined;}s.remove();};

  }
  flushing=false;
  if(!queue.length&&sync!=='loading') sync='ok';
  updSync();
}
async function pull(){
  if(!gasReady()){sync='nourl';updSync();return;}
  sync='loading';updSync();
  try{
    const j=await jsonp({});
    if(!j||!j.ok) throw new Error('試算表回報錯誤：'+((j&&j.error)||'未知'));
    const merge=(srv,type)=>{
      const m=new Map(); (srv||[]).forEach(x=>x&&x.id&&m.set(x.id,x));
      queue.filter(q=>q.type===type).forEach(q=>m.set(q.rec.id,q.rec));
      return [...m.values()];
    };
    all={attempts:merge(j.attempts,'attempt'),corrections:merge(j.corrections,'correction')};
    persist(); refreshStore();
    sync=queue.length?'offline':'ok';
    if(['home','records'].includes(view.name)) render(); else updSync();
  }catch(e){sync='offline';lastErr='讀取失敗：'+(e.message||e);updSync();}
}
function syncText(){
  if(sync==='nourl')return '⚠️ 尚未設定試算表網址，紀錄只存在這支手機';
  if(sync==='loading'||sync==='init')return '⏳ 正在讀取試算表紀錄…';
  if(queue.length)return `⚠️ 有 ${queue.length} 筆紀錄還沒上傳，連上網路會自動補傳`;
  if(sync==='offline')return '⚠️ 連不到試算表，目前顯示手機裡的紀錄';
  return '✅ 紀錄已同步到 Google 試算表';
}
function updSync(){const el=document.getElementById('sync');if(!el)return;
  el.innerHTML=esc(syncText())+((queue.length||sync==='offline')&&gasReady()?
    `<br><button class="link" onclick="retrySync()">重新上傳</button>${lastErr?`<div style="margin-top:6px;color:#c8372d;font-size:12px;word-break:break-all">${esc(lastErr)}</div>`:''}`:'');}
function retrySync(){lastErr='';sync='loading';updSync();flush().then(pull);}

// ===== 題型工具 =====
const norm=s=>String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' ').replace(/[.!?。]+$/,'');
function isBlank(q,v){return q.t==='fill'?!norm(v):(v==null||v<0);}
function isRight(q,v){
  if(q.t==='fill'){const n=norm(v);if(!n)return false;return q.ans.some(x=>{x=norm(x);return n===x||(x[0]+n)===x;});}
  return v===q.a;
}
function ansText(q,v){return isBlank(q,v)?'未作答':(q.t==='fill'?`「${esc(v)}」`:L[v]);}
function rightText(q){return q.t==='fill'?esc(q.ans.join(' / ')):`${L[q.a]}. ${esc(q.o[q.a])}`;}
function secColor(P,k){const s=P.secs.find(x=>x.k===k);return s?s.c:'var(--pri)';}
const fillAttr='autocapitalize="none" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done"';
function qTag(q){return `<span class="tag" style="background:#f0eee8">${esc(q.r)}</span>${q.t==='fill'?'<span class="tag" style="background:#e8eefc;color:#2f5bd3">填寫</span>':''}`;}
// 檢視用：顯示對錯
function qResult(q,my){
  if(q.t==='fill'){const ok=isRight(q,my);
    return `<div class="fillres ${ok?'right':'wrong'}">你的答案：${ansText(q,my)}${ok?'　✓':''}</div>${ok?'':`<div class="fillres right">正確答案：${rightText(q)}</div>`}`;}
  const ok=my===q.a;
  return q.o.map((o,i)=>`<button class="opt ${i===q.a?'right':(i===my?'wrong':'')}" disabled><b>${L[i]}</b><span>${esc(o)}${i===my&&!ok?'　← 你的答案':''}${i===q.a?'　✓ 正確答案':''}</span></button>`).join('');
}

async function submitExam(){
  const P=PAPERS[exam.paper];Q=P.Q;
  const ans=Q.map(q=>{const v=exam.answers[q.id];return q.t==='fill'?String(v==null?'':v).trim():(v==null?-1:v);});
  const per={};P.secs.forEach(s=>per[s.k]=0);
  const wrong=[];
  Q.forEach(q=>{if(isRight(q,ans[q.id]))per[q.s]++;else wrong.push(q.id);});
  const correct=Q.length-wrong.length;
  const att={id:uid(),ver:P.ver,paper:P.no,ts:Date.now(),dur:Math.round((Date.now()-exam.start)/1000),
    answers:ans,per,correct,score:Math.round(correct*100/Q.length*10)/10,wrong};
  exam=null;
  await saveDoc('attempts',att);
  go('result',{id:att.id});

function startCorr(attId){

  corr.qids.forEach(id=>{

    if(!corr.done){
      body=q.t==='fill'
        ?`<input class="fillin" ${fillAttr} placeholder="輸入英文單字" value="${esc(my||'')}" oninput="ctype(${id},this.value)">`

    }

  });
  if(corr.done){
    const okN=corr.qids.filter(id=>isRight(Q[id],corr.answers[id])).length;
    const left=pendingOf(a).length;
    h+=`<div class="card" style="text-align:center"><b>訂正成功 ${okN} / ${corr.qids.length} 題</b><br>

  }
  $('#app').innerHTML=h;
}

function ctype(id,v){corr.answers[id]=v;}
async function submitCorr(){
  const miss=corr.qids.filter(id=>isBlank(Q[id],corr.answers[id]));
  if(miss.length){modal(`<h2 style="margin-top:0">還有 ${miss.length} 題沒作答</h2>
    <button class="btn" onclick="closeModal()">回去作答</button>`);return;}
  const items=corr.qids.map(id=>{const q=Q[id];let v=corr.answers[id];if(q.t==='fill')v=String(v).trim();return {qid:id,ans:v,ok:isRight(q,v)};});
  const A=getAtt(corr.attemptId);
  const rec={id:uid(),ver:A.ver,paper:useAtt(A).no,ts:Date.now(),attemptId:corr.attemptId,attemptTs:A.ts,dur:Math.round((Date.now()-corr.start)/1000),
    items,okCount:items.filter(x=>x.ok).length,total:items.length};
  corr.done=true;
  await saveDoc('corrections',rec);
  render();window.scrollTo(0,0);
}

// ===== 紀錄 =====
function records(){
  bottom(null);
  const tab=view.tab||'att';
  let h=`<h1>紀錄</h1><div class="seg">
    <button class="${tab==='att'?'on':''}" onclick="go('records',{tab:'att'})">作答紀錄</button>
    <button class="${tab==='cor'?'on':''}" onclick="go('records',{tab:'cor'})">訂正紀錄</button>
    <button class="${tab==='stat'?'on':''}" onclick="go('records',{tab:'stat'})">錯題統計</button></div>`;
  if(tab==='att'){
    if(!store.attempts.length)h+='<div class="card muted">還沒有作答紀錄</div>';
    else{
      h+=`<div class="card" style="padding:8px 10px;overflow-x:auto"><table><tr><th>日期</th><th>卷</th><th>總分</th><th>各部分答對</th><th>待訂正</th></tr>
      ${store.attempts.map(a=>{const P=paperByVer(a.ver);const old=!P;const p=pendingOf(a).length;
        const det=P?P.secs.map(s=>`${s.k[0]}${a.per[s.k]}`).join(' '):'—';
        return `<tr ${old?'style="opacity:.55"':`onclick="go('result',{id:'${a.id}'})" style="cursor:pointer"`}>
        <td style="font-size:13px">${fmtTime(a.ts).slice(5)}</td><td style="font-size:13px">${P?P.no:'舊'}</td><td><b>${a.score}</b></td>
        <td style="font-size:13px">${det}</td>
        <td>${old?'<span class="tag">舊卷</span>':p?`<span class="tag pend">${p}</span>`:(a.wrong.length?'<span class="tag ok">完成</span>':'—')}</td></tr>`;}).join('')}
      </table></div><div class="muted" style="text-align:center">點任一列可看成績、錯題和訂正</div>`;
    }
  }else if(tab==='cor'){
    const list=store.corrections.filter(c=>paperByVer(c.ver));
    if(!list.length)h+='<div class="card muted">還沒有訂正紀錄</div>';
    list.forEach(c=>{
      const CP=paperByVer(c.ver);
      const a=getAtt(c.attemptId);
      h+=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${fmtTime(c.ts)}</b>
        <span class="tag ${c.okCount===c.total?'ok':'pend'}">成功 ${c.okCount}/${c.total}</span></div>
        <div class="muted">${CP.no}・訂正的是 ${a?fmtTime(a.ts)+'（'+a.score+' 分）':'已刪除的考試'}・用時 ${fmtDur(c.dur||0)}</div>
        <div style="margin-top:6px;font-size:15px">${c.items.map(it=>{const q=CP.Q[it.qid];
          return `<div>${it.ok?'✅':'❌'} 第 ${it.qid+1} 題（${q.s}）答 ${ansText(q,it.ans)}${it.ok?'':`，正解 ${q.t==='fill'?esc(q.ans[0]):L[q.a]}`}</div>`;}).join('')}</div>
        ${a?`<button class="link" style="margin-top:6px" onclick="go('review',{id:'${a.id}',f:'wrong'})">看這次考試的錯題 →</button>`:''}</div>`;
    });
  }else{
    const cnt={};store.attempts.filter(a=>paperByVer(a.ver)).forEach(a=>a.wrong.forEach(id=>{const k=a.ver+'|'+id;cnt[k]=(cnt[k]||0)+1;}));
    const arr=Object.entries(cnt).sort((x,y)=>y[1]-x[1]);
    if(!arr.length)h+='<div class="card muted">還沒有錯題</div>';
    else{
      h+=`<div class="muted">所有考試中，最常錯的題目（共考 ${store.attempts.length} 次）</div>`;
      arr.forEach(([k,n])=>{const [v,id]=k.split('|');const SP=paperByVer(v);const q=SP.Q[id];
        h+=`<div class="card q"><div class="qn"><span class="tag" style="background:#f0eee8">${SP.no}・${q.s}</span>第 ${+id+1} 題　<span class="tag bad">錯 ${n} 次</span></div>
        <div class="qt">${esc(q.q)}</div><div class="exp">正解 ${rightText(q)}<br>💡 ${esc(q.e)}</div></div>`;});
    }
  }
  h+=`<button class="btn ghost" onclick="go('home')">回首頁</button>`;
  $('#app').innerHTML=h;
}

$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
render();
flush().then(pull);
window.addEventListener('online',()=>flush().then(pull));
</script>
