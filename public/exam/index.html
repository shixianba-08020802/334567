<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>喜羊羊測驗區</title>
<style>
:root{
  --bg:#f6f5f1;--card:#fff;--ink:#1f2328;--sub:#5f6670;--line:#e3e1da;
  --pri:#2f5bd3;--pri-soft:#e8eefc;--ok:#1e8a4c;--ok-soft:#e5f5ec;--bad:#c8372d;--bad-soft:#fbe9e7;
  --c1:#c2571a;--c2:#2f5bd3;--c3:#7a3fc4;--c4:#1e8a4c;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 110px}
h1{font-size:24px;margin:8px 0 4px}
h2{font-size:20px;margin:22px 0 10px}
.muted{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font-size:17px;font-weight:600;
  background:var(--pri);color:#fff;cursor:pointer;font-family:inherit;margin:8px 0}
.btn.sec{background:var(--card);color:var(--pri);border:1.5px solid var(--pri)}
.btn.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);font-weight:500}
.btn.okb{background:var(--ok)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px}.row>*{flex:1}
.topbar{position:sticky;top:0;z-index:5;background:rgba(246,245,241,.96);backdrop-filter:blur(6px);
  border-bottom:1px solid var(--line);padding:10px 14px 8px;margin:0 -14px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px}
.prog>i{display:block;height:100%;background:var(--pri);width:0;transition:width .2s}
.tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.tabs a{flex:1;text-align:center;font-size:14px;padding:5px 6px;border-radius:8px;background:var(--card);
  border:1px solid var(--line);color:var(--ink);text-decoration:none;white-space:nowrap}
.subj{font-size:19px;font-weight:700;margin:26px 0 6px;padding-left:10px;border-left:5px solid var(--sc)}
.q .qn{font-weight:700;color:var(--sub);font-size:14px}
.q .qt{margin:4px 0 10px;white-space:pre-wrap}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fafaf8;border:1.5px solid var(--line);
  border-radius:10px;padding:11px 12px;margin:7px 0;font-size:16px;font-family:inherit;color:var(--ink);cursor:pointer}
.opt b{flex:0 0 24px;height:24px;border-radius:50%;border:1.5px solid var(--sub);display:flex;align-items:center;
  justify-content:center;font-size:13px;color:var(--sub)}
.opt.sel{border-color:var(--pri);background:var(--pri-soft)}
.opt.sel b{background:var(--pri);border-color:var(--pri);color:#fff}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right b{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong b{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.q.unans{border-color:#e7b54a}
.exp{background:#f4f2ec;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:15px}
.tag{display:inline-block;font-size:13px;padding:1px 8px;border-radius:20px;margin-right:4px}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.pend{background:#fdf1d8;color:#9a6a00}
.big{font-size:54px;font-weight:800;text-align:center;line-height:1.1;margin:6px 0}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;border-top:4px solid var(--sc)}
.tile .n{font-size:26px;font-weight:800}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:8px 4px;text-align:center}
th{color:var(--sub);font-weight:600;font-size:13px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;margin:10px 0}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-size:15px;font-family:inherit;color:var(--sub);cursor:pointer}
.seg button.on{background:var(--pri);color:#fff}
.bottombar{position:fixed;left:0;right:0;bottom:0;background:rgba(246,245,241,.97);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.bottombar .inner{max-width:640px;margin:0 auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;padding:20px;max-width:400px;width:100%}
.note{font-size:13px;color:var(--sub);text-align:center;margin-top:16px}
.link{color:var(--pri);background:none;border:0;font-size:15px;padding:0;cursor:pointer;font-family:inherit}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bottombar hidden" id="bottom"><div class="inner" id="bottomInner"></div></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>

<script>
// ===== 題庫 =====
const SUBJ=[
  {k:'國文',c:'var(--c1)'},{k:'英文',c:'var(--c2)'},{k:'數學',c:'var(--c3)'},{k:'生物',c:'var(--c4)'}
];
const PAPERS=[{"no":"卷一","lv":"入門","ver":"段考2-卷一(入門)","Q":[{"s":"國文","r":"L4 論語選","q":"《論語》是記錄孔子和弟子言行的書，它屬於哪一種體裁？","o":["章回小說","近體詩","語錄體","書信體"],"a":2,"e":"《論語》記錄孔子與弟子的言行對話，屬於語錄體。"},{"s":"國文","r":"L4 論語選","q":"《論語》是由誰編寫而成的？","o":["朱熹","孔子的弟子及再傳弟子","孟子","孔子親自寫成"],"a":1,"e":"《論語》由孔子的弟子和再傳弟子記錄、編纂而成，不是孔子自己寫的。"},{"s":"國文","r":"L4 論語選","q":"孔子是哪一個學派的代表人物？","o":["儒家","道家","墨家","法家"],"a":0,"e":"孔子是儒家學派的創始人。道家代表是老子、莊子。"},{"s":"國文","r":"L4 論語選","q":"「四書」包括哪四本書？下列何者「不屬於」四書？","o":["孟子","詩經","中庸","論語"],"a":1,"e":"四書：《論語》《孟子》《大學》《中庸》。《詩經》屬於五經。"},{"s":"國文","r":"L5 背影","q":"〈背影〉的作者是誰？","o":["杏林子","楊喚","朱自清","胡適"],"a":2,"e":"〈背影〉是朱自清的散文名篇。"},{"s":"國文","r":"L5 背影","q":"〈背影〉中，父親在車站特地越過月臺去買了什麼給作者？","o":["橘子","車票","報紙","包子"],"a":0,"e":"父親吃力地爬上月臺，買了朱紅的橘子。"},{"s":"國文","r":"L5 背影","q":"〈背影〉屬於哪一種文體？","o":["新詩","劇本","散文","小說"],"a":2,"e":"〈背影〉是記敘抒情的散文。"},{"s":"國文","r":"L6 心囚","q":"〈心囚〉的作者是誰？","o":["朱自清","胡適","杏林子","楊喚"],"a":2,"e":"〈心囚〉作者杏林子，本名劉俠。"},{"s":"國文","r":"L5 背影","q":"「蹣跚」的正確讀音是哪一個？","o":["ㄇㄢˇ ㄕㄢ","ㄆㄢˊ ㄕㄢ","ㄇㄢˊ ㄕㄢ","ㄆㄢˇ ㄕㄢˋ"],"a":1,"e":"蹣跚讀 ㄆㄢˊ ㄕㄢ，形容走路緩慢、搖擺不穩。"},{"s":"國文","r":"L4 論語選","q":"「學而時習之，不亦說乎？」句中的「說」是什麼意思？","o":["解說","說服","說話","高興、喜悅"],"a":3,"e":"「說」通「悅」，讀 ㄩㄝˋ，意思是高興。"},{"s":"英文","r":"U3","q":"____ quiet in the library, please.","o":["Don't","Is","Are","Be"],"a":3,"e":"祈使句用原形動詞開頭，be 動詞的原形是 Be。"},{"s":"英文","r":"U3","q":"____ run in the hallway. It's dangerous.","o":["Not","Doesn't","Don't","No"],"a":2,"e":"否定祈使句：Don't + 原形動詞。"},{"s":"英文","r":"U3","q":"Tom can ____ the guitar very well.","o":["playing","plays","play","to play"],"a":2,"e":"助動詞 can 後面接原形動詞。"},{"s":"英文","r":"U4","q":"A: What day is it today?\nB: ____","o":["It's May 5th.","It's sunny.","It's Friday.","It's two o'clock."],"a":2,"e":"What day 問「星期幾」。May 5th 是日期，two o'clock 是時間。"},{"s":"英文","r":"U4","q":"A: What time is it?\nB: ____","o":["It's June 1st.","It's hot.","It's Monday.","It's seven thirty."],"a":3,"e":"What time 問「幾點」，回答時間。"},{"s":"英文","r":"U6","q":"There ____ a cat under the chair.","o":["am","is","are","be"],"a":1,"e":"a cat 是單數，用 There is。"},{"s":"英文","r":"U6","q":"There ____ three dogs in the yard.","o":["be","are","is","am"],"a":1,"e":"three dogs 是複數，用 There are。"},{"s":"英文","r":"U3","q":"My brother and I can't do it. Please help ____.","o":["we","our","us","ours"],"a":2,"e":"help 後面接受格；we 的受格是 us。"},{"s":"英文","r":"U5","q":"下列哪一個序數的寫法「正確」？","o":["three → threeth","five → fiveth","one → first","two → secend"],"a":2,"e":"正確：first、second、third、fifth。"},{"s":"英文","r":"U5","q":"「十二月」的英文是哪一個？","o":["October","November","December","September"],"a":2,"e":"December 十二月；November 十一月；October 十月；September 九月。"},{"s":"數學","r":"2-1","q":"下列哪一個數是 12 的因數？","o":["8","5","6","24"],"a":2,"e":"12 的因數：1、2、3、4、6、12。24 是 12 的倍數。"},{"s":"數學","r":"2-1","q":"下列哪一個數是質數？","o":["15","2","21","9"],"a":1,"e":"2 只有 1 和 2 兩個因數，是質數（也是唯一的偶數質數）。9=3×3，15=3×5，21=3×7。"},{"s":"數學","r":"2-1","q":"關於「1」的敘述，哪一項正確？","o":["1 是合數","1 是質數","1 既不是質數也不是合數","1 是最小的質數"],"a":2,"e":"質數要剛好有 2 個因數；1 只有 1 個因數，所以既不是質數也不是合數。最小的質數是 2。"},{"s":"數學","r":"2-1","q":"下列哪一個數是 5 的倍數？","o":["1237","1235","1234","1236"],"a":1,"e":"個位數是 0 或 5 的數，就是 5 的倍數。"},{"s":"數學","r":"2-2","q":"8 和 12 的最大公因數是多少？","o":["2","4","96","24"],"a":1,"e":"8 的因數：1,2,4,8；12 的因數：1,2,3,4,6,12。共同最大的是 4。"},{"s":"數學","r":"2-2","q":"4 和 6 的最小公倍數是多少？","o":["24","12","2","10"],"a":1,"e":"4 的倍數：4,8,12…；6 的倍數：6,12…。最小的共同倍數是 12。"},{"s":"數學","r":"2-3","q":"把 12/18 約成最簡分數是多少？","o":["2/3","6/9","3/2","4/6"],"a":0,"e":"分子分母同除以最大公因數 6：12÷6=2，18÷6=3。"},{"s":"數學","r":"2-3","q":"計算：1/2 + 1/3 = ？","o":["1/6","2/6","5/6","2/5"],"a":2,"e":"通分：3/6 + 2/6 = 5/6。"},{"s":"數學","r":"2-4","q":"2³ = ？","o":["9","5","8","6"],"a":2,"e":"2³ = 2×2×2 = 8，不是 2×3。"},{"s":"數學","r":"2-4","q":"3² × 3³ = ？","o":["9⁶","9⁵","3⁵","3⁶"],"a":2,"e":"底數相同相乘，指數相加：3²⁺³ = 3⁵。"},{"s":"生物","r":"2-3","q":"光合作用的主要產物是什麼？","o":["氧氣和水","葡萄糖和氧氣","二氧化碳和水","葡萄糖和二氧化碳"],"a":1,"e":"二氧化碳 + 水 →（光、葉綠素）→ 葡萄糖 + 氧氣。"},{"s":"生物","r":"2-3","q":"植物進行光合作用的胞器是什麼？","o":["葉綠體","液胞","粒線體","細胞核"],"a":0,"e":"葉綠體含葉綠素，可吸收光能進行光合作用。"},{"s":"生物","r":"2-3","q":"在食物上滴碘液，如果含有澱粉，會變成什麼顏色？","o":["黃色","藍黑色","紅色","無色"],"a":1,"e":"碘液遇澱粉呈藍黑色。"},{"s":"生物","r":"2-4","q":"食物中的澱粉最早在哪個部位開始被消化？","o":["口腔","小腸","胃","大腸"],"a":0,"e":"唾液含澱粉酶，澱粉在口腔就開始被分解。"},{"s":"生物","r":"2-4","q":"人體吸收養分最主要的器官是哪一個？","o":["食道","胃","小腸","大腸"],"a":2,"e":"小腸是消化和吸收養分的主要場所。"},{"s":"生物","r":"3-1～3-2","q":"植物體中負責把根吸收的水分往上運送的構造是什麼？","o":["韌皮部","氣孔","木質部","形成層"],"a":2,"e":"木質部運送水分和礦物質（由下往上）。"},{"s":"生物","r":"3-1～3-2","q":"葉子製造的養分，是靠哪一個構造運送到植物各部位？","o":["木質部","氣孔","根毛","韌皮部"],"a":3,"e":"韌皮部運送養分，可以往上也可以往下。"},{"s":"生物","r":"3-3","q":"人的心臟有幾個腔室？","o":["2 個","5 個","4 個","3 個"],"a":2,"e":"左心房、左心室、右心房、右心室，共 4 個。"},{"s":"生物","r":"3-3","q":"血液中負責運送氧氣的是哪一種成分？","o":["紅血球","白血球","血小板","血漿"],"a":0,"e":"紅血球含血紅素，可攜帶氧氣。"},{"s":"生物","r":"3-4","q":"人體防禦病原體的第一道防線是什麼？","o":["淋巴結","抗體","皮膚和黏膜","白血球"],"a":2,"e":"皮膚和黏膜阻擋病原體進入人體，是第一道防線。"}]},{"no":"卷二","lv":"基礎","ver":"段考2-卷二(基礎)","Q":[{"s":"國文","r":"L4 論語選","q":"「有朋自遠方來，不亦樂乎？」的意思是什麼？","o":["朋友住得太遠，不容易見面","遠方的朋友比較好","有志同道合的朋友從遠方來，不是很快樂嗎？","朋友從遠方來，一定要請客"],"a":2,"e":"「不亦……乎」是「不是很……嗎」，表示非常快樂。"},{"s":"國文","r":"L4 論語選","q":"「人不知而不慍」的「慍」是什麼意思？","o":["知道","學習","生氣、怨恨","溫暖"],"a":2,"e":"慍：讀 ㄩㄣˋ，生氣、怨恨。別人不了解自己也不生氣，才是君子。"},{"s":"國文","r":"L4 論語選","q":"「吾日三省吾身」是誰說的？","o":["孔子","曾子","子路","孟子"],"a":1,"e":"這是曾子說的話，記錄在《論語》中。"},{"s":"國文","r":"L4 論語選","q":"「溫故而知新，可以為師矣。」句中的「故」指的是什麼？","o":["舊的知識","所以","故事","故鄉"],"a":0,"e":"故：學過的舊知識。溫習舊知識而能有新體會。"},{"s":"國文","r":"L5 背影","q":"「那年冬天，祖母死了，父親的差使也交卸了，正是禍不單行的日子。」「禍不單行」是什麼意思？","o":["做壞事會有報應","不幸的事接連發生","好事成雙","災禍只有一件"],"a":1,"e":"禍不單行：不幸的事情往往接二連三地發生。"},{"s":"國文","r":"L5 背影","q":"父親不斷叮嚀茶房照顧作者，作者「心裡暗笑他的迂」。「迂」是什麼意思？","o":["言行拘泥、不切實際","生氣","勇敢","聰明"],"a":0,"e":"迂：讀 ㄩ，拘泥、不知變通。作者當時覺得父親太過操心。"},{"s":"國文","r":"L5 背影","q":"在車上，作者把父親為他做的什麼東西鋪在座位上？","o":["棉被","黑布馬褂","紫毛大衣","深青棉袍"],"a":2,"e":"「我將他給我做的紫毛大衣鋪好坐位」。黑布馬褂、深青布棉袍是父親身上穿的。"},{"s":"國文","r":"L5 背影","q":"下列哪一個詞語「沒有」錯別字？","o":["躊躇不前","變賣典值","步履蹣珊","滿院狼籍"],"a":0,"e":"正確寫法：狼「藉」、蹣「跚」、典「質」。"},{"s":"國文","r":"L6 心囚","q":"〈心囚〉這個題目最想告訴讀者什麼？","o":["不要隨便出門","監獄的生活很辛苦", ,"2 × 3 × 10","2² × 3 × 5"],"a":3,"e":"60 = 2×2×3×5 = 2²×3×5，全部是質數並用指數表示。"},{"s":"數學","r":"2-2","q":"12 和 18 的最大公因數是多少？","o":["36","216","6","3"],"a":2,"e":"12 = 2²×3，18 = 2×3²，共同部分取次方小的：2×3 = 6。"},{"s":"數學","r":"2-2","q":"6、8、12 三個數的最小公倍數是多少？","o":["96","2","48","24"],"a":3,"e":"6 = 2×3，8 = 2³，12 = 2²×3，每個質因數取次方最大的：2³×3 = 24。"},{"s":"數學","r":"2-2","q":"下列哪一組數「互質」？","o":["4 和 6","8 和 9","9 和 12","10 和 15"],"a":1,"e":"互質：最大公因數是 1。8 和 9 的最大公因數是 1；其他組分別有 2、3、5。"},{"s":"數學","r":"2-3","q":"計算：2/3 + (−5/6) = ？","o":["7/6","−3/9","−1/6","1/6"],"a":2,"e":"通分：4/6 + (−5/6) = −1/6。"},{"s":"數學","r":"2-3","q":"計算：(−3/4) × 8/9 = ？","o":["−27/32","−24/36","−2/3","2/3"],"a":2,"e":"負 × 正 = 負；約分後 −(1×2)/(1×3) = −2/3。"},{"s":"數學","r":"2-4","q":"2³ × 2⁴ = ？","o":["2⁷","4⁷","4¹²","2¹²"],"a":0,"e":"底數相同相乘，指數相加 → 2⁷。"},{"s":"數學","r":"2-4","q":"(2³)² = ？","o":["2⁶","4³","2⁵","2⁹"],"a":0,"e":"次方的次方，指數相乘：2³ˣ² = 2⁶。"},{"s":"生物","r":"2-3","q":"光合作用的原料是什麼？","o":["氧氣和水","葡萄糖和氧氣","澱粉和水","二氧化碳和水"],"a":3,"e":"原料：二氧化碳 + 水；產物：葡萄糖 + 氧氣。"},{"s":"生物","r":"2-3","q":"葉片主要從哪裡吸收空氣中的二氧化碳？","o":["葉脈","氣孔","木質部","根毛"],"a":1,"e":"氣孔是氣體進出葉片的通道。"},{"s":"生物","r":"2-3","q":"葉片上的氣孔是由哪一種細胞圍成的？","o":["根毛細胞","表皮毛","保衛細胞","紅血球"],"a":2,"e":"兩個保衛細胞圍成氣孔，可控制氣孔的開關。"},{"s":"生物","r":"2-4","q":"胃液主要可以消化哪一種養分？","o":["纖維素","蛋白質","澱粉","脂質"],"a":1,"e":"胃液含蛋白酶，開始分解蛋白質。"},{"s":"生物","r":"2-4","q":"膽汁是由哪一個器官製造的？","o":["胰臟","肝臟","膽囊","胃"],"a":1,"e":"膽汁由肝臟製造，儲存在膽囊。"},{"s":"生物","r":"2-4","q":"大腸的主要功能是什麼？","o":["吸收水分","分泌唾液","消化蛋白質","分泌膽汁"],"a":0,"e":"大腸主要吸收水分，剩下的殘渣形成糞便。"},{"s":"生物","r":"3-1～3-2","q":"植物的根主要靠什麼構造吸收水分？","o":["氣孔","根毛","葉綠體","韌皮部"],"a":1,"e":"根毛增加吸收面積，是吸收水分的主要構造。"},{"s":"生物","r":"3-3","q":"把血液從心臟帶出去的血管叫什麼？","o":["微血管","靜脈","動脈","淋巴管"],"a":2,"e":"動脈：血液離開心臟；靜脈：血液流回心臟。"},{"s":"生物","r":"3-3","q":"血液中幫助傷口止血、凝固的是哪一種成分？","o":["血漿","白血球","紅血球","血小板"],"a":3,"e":"血小板可以幫助血液凝固。"},{"s":"生物","r":"3-4","q":"白血球在人體中最主要的功能是什麼？","o":["運送氧氣","運送養分","吞噬病原體、保護身體","幫助凝血"],"a":2,"e":"白血球負責防禦，可以吞噬入侵的病原體。"}]},{"no":"卷三","lv":"標準","ver":"段考2-卷三(標準)","Q":[{"s":"國文","r":"L4 論語選","q":"「學而不思則罔，思而不學則殆。」這句話的意思是什麼？","o":["學習一定要背誦，不必思考","只學習不思考會迷惑無所得；只思考不學習會疑惑不安","學習和思考只要做好一項就夠了","思考比學習重要"],"a":1,"e":"罔：迷惘、無所得；殆：疑惑不安。學習和思考要並重。"},{"s":"國文","r":"L4 論語選","q":"「三人行，必有我師焉：擇其善者而從之，其不善者而改之。」這段話勉勵我們什麼？","o":["向別人的優點學習，看到別人的缺點就反省改正自己","只能向老師學習","出門要結伴同行才安全","朋友越多越好"],"a":0,"e":"別人的優點要學習；別人的缺點拿來檢討自己，有就改正。"},{"s":"國文","r":"L4 論語選","q":"「知之為知之，不知為不知，是知也。」這句話強調哪一種學習態度？","o":["誠實面對自己懂與不懂","不懂的事不必去學","知道得越多越好","要假裝什麼都懂"],"a":0,"e":"知道就說知道，不知道就說不知道，這才是真正的智慧。"},{"s":"國文","r":"L4 論語選","q":"「見賢思齊焉，見不賢而內自省也。」的意思是什麼？","o":["看到賢能的人就嫉妒他","只和賢能的人做朋友","看到賢能的人想向他看齊；看到不賢的人就反省自己有沒有同樣的缺點","看到不賢的人要責罵他"],"a":2,"e":"思齊：想和他一樣好；內自省：在內心反省自己。"},{"s":"國文","r":"L5 背影","q":"朱自清〈背影〉中，讓作者最感動、流下眼淚的父親背影，是父親在做什麼的時候？","o":["在車站送行，越過月臺去買橘子","在祖母的喪禮上","在家中寫信","離家去找工作"],"a":0,"e":"父親身材肥胖，仍吃力地爬上月臺為兒子買橘子，那個背影讓作者落淚。"},{"s":"國文","r":"L5 背影","q":"〈背影〉中，父親原本說不送了，後來為什麼還是決定親自送作者去車站？","o":["想順便去買橘子","不放心託茶房送，怕他照顧不周","要搭同一班火車","祖母生前交代的"],"a":1,"e":"父親不放心交給茶房（旅館服務人員），猶豫之後決定自己送，表現父親的關愛。"},{"s":"國文","r":"L5 背影","q":"下列哪一項最符合〈背影〉的主旨？","o":["透過父親的背影，寫出父親深厚的愛和作者的思念","說明買橘子的方法","批評父親做事拖拉","描寫火車站熱鬧的景象"],"a":0,"e":"全文以「背影」為線索，寫父愛，以及作者事後體會父愛的感動與懷念。"},{"s":"國文","r":"L6 心囚","q":"關於〈心囚〉作者杏林子的敘述，哪一項正確？","o":["以寫武俠小說聞名","清代著名的詩人","本名劉俠，因類風濕性關節炎行動不便，仍努力寫作，並創辦伊甸基金會","大學中文系教授，一生身體健康"],"a":2,"e":"杏林子（劉俠）少年時罹患類風濕性關節炎，仍以寫作鼓勵人心，創辦伊甸社會福利基金會。"},{"s":"國文","r":"L5 背影","q":"下列「 」中的字，哪一個讀音正確？","o":["「躊」躇：ㄔㄡˊ","「簌」簌：ㄕㄨˋ","典「質」：ㄓˊ","狼「藉」：ㄐㄧㄝˋ"],"a":0,"e":"躊躇 ㄔㄡˊ ㄔㄨˊ。狼藉讀 ㄐㄧˊ；簌簌讀 ㄙㄨˋ；典質讀 ㄓˋ。"},{"s":"國文","r":"L5 背影","q":"「禍不單行」的相反意思，最接近下列哪一個詞語？","o":["雪上加霜","接二連三","雙喜臨門","屋漏偏逢連夜雨"],"a":2,"e":"禍不單行：壞事接連發生；雙喜臨門：好事同時到來。雪上加霜、屋漏偏逢連夜雨意思相近。"},{"s":"英文","r":"U4","q":"下列哪一個 V-ing 的拼法「正確」？","o":["siting","swiming","runing","making"],"a":3,"e":"make → making（去 e 加 ing）。run → running、swim → swimming、sit → sitting（重複字尾再加 ing）。"},{"s":"英文","r":"U4","q":"Tom and I ____ watching TV now.","o":["are","be","is","am"],"a":0,"e":"Tom and I 是複數（我們），be 動詞用 are。"},{"s":"英文","r":"U4","q":"A: ____ Amy and Ben dancing?\nB: Yes, they are.","o":["Are","Does","Do","Is"],"a":0,"e":"主詞 Amy and Ben 是複數，現在進行式問句用 Are 開頭。"},{"s":"英文","r":"U3","q":"A: Can you swim?\nB: No, I ____.","o":["can","am not","don't","can't"],"a":3,"e":"用 Can 問，否定簡答 No, I can't."},{"s":"英文","r":"U3","q":"Don't ____ late for school.","o":["are","being","be","is"],"a":2,"e":"Don't 後面接原形，be 動詞原形是 be。"},{"s":"英文","r":"U5","q":"「第二十」的序數英文是哪一個？","o":["twentyth","twentith","twenty","twentieth"],"a":3,"e":"ty 結尾的數字改 y 為 ie 再加 th：twenty → twentieth。"},{"s":"英文","r":"U5","q":"Christmas is ____ December 25th.","o":["on","for","in","at"],"a":0,"e":"特定日期前用 on。"},{"s":"英文","r":"U6","q":"There ____ a book and two pens on the desk.","o":["am","are","be","is"],"a":3,"e":"There is/are 看最靠近的名詞：a book 是單數，所以用 is。"},{"s":"英文","r":"U6","q":"There ____ some water in the bottle.","o":["is","am","are","be"],"a":0,"e":"water 是不可數名詞，用 There is。"},{"s":"英文","r":"U4","q":"A: What time do you get up?\nB: ____","o":["I get up at six thirty.","It's July.","I get up on six.","It's Monday."],"a":0,"e":"問幾點起床，回答 at + 時間。"},{"s":"數學","r":"2-1","q":"下列哪一個數是質數？","o":["57","59","91","51"],"a":1,"e":"51 = 3×17，57 = 3×19，91 = 7×13，只有 59 是質數。"},{"s":"數學","r":"2-1","q":"84 的標準分解式是哪一個？","o":["2³ × 3 × 7","2 × 42","2² × 3 × 7","4 × 21"],"a":2,"e":"84 = 2×2×3×7 = 2²×3×7。"},{"s":"數學","r":"2-1","q":"下列哪一個數是 9 的倍數？","o":["2345","3456","1234","4567"],"a":1,"e":"各位數字和是 9 的倍數就是 9 的倍數：3+4+5+6 = 18 ✓。"},{"s":"數學","r":"2-1","q":"36 一共有幾個正因數？","o":["9 個","8 個","6 個","12 個"],"a":0,"e":"1,2,3,4,6,9,12,18,36，共 9 個。也可用 36 = 2²×3²，(2+1)×(2+1) = 9。"},{"s":"數學","r":"2-2","q":"把長 24 公分、寬 36 公分的長方形紙，剪成大小相同的正方形且沒有剩，正方形邊長最長是幾公分？","o":["6","72","12","24"],"a":2,"e":"邊長要同時整除 24 和 36，最長就是最大公因數 12。"},{"s":"數學","r":"2-2","q":"A 公車每 12 分鐘一班，B 公車每 18 分鐘一班。兩車同時發車後，至少再過幾分鐘會再同時發車？","o":["72","6","216","36"],"a":3,"e":"要找 12 和 18 的最小公倍數：36。"},{"s":"數學","r":"2-3","q":"計算：(−5/6) ÷ (−10/3) = ？","o":["25/9","−25/9","1/4","−1/4"],"a":2,"e":"除以一個數＝乘以倒數：(−5/6) × (−3/10) = 15/60 = 1/4。"},{"s":"數學","r":"2-3","q":"下列哪一個數最大？","o":["−2/3","−1/2","−1/3","−3/4"],"a":2,"e":"負數的絕對值越小越大。1/3 最小，所以 −1/3 最大。"},{"s":"數學","r":"2-4","q":"計算：(−3)⁴ ÷ 3² = ？","o":["−3","9","3","−9"],"a":1,"e":"(−3)⁴ = 81（負數偶數次方為正），81 ÷ 9 = 9。"},{"s":"數學","r":"2-4","q":"計算：(−2)³ × (−2)² = ？","o":["32","−32","−64","64"],"a":1,"e":"底數相同指數相加：(−2)⁵ = −32（負數奇數次方為負）。"},{"s":"生物","r":"2-3","q":"把植物放暗處一天後，用鋁箔遮住一片葉子的一部分，照光數小時，再去除葉綠素並滴碘液。結果會如何？","o":["照光部分變藍黑色，遮光部分不變","整片葉子都變藍黑色","整片葉子都不變色","遮光部分變藍黑色，照光部分不變"],"a":0,"e":"照光部分進行光合作用產生澱粉，遇碘液變藍黑色；遮光部分不產生澱粉。"},{"s":"生物","r":"2-3","q":"光合作用實驗中，把葉片放進酒精中「隔水加熱」的目的是什麼？","o":["溶出葉綠素，方便觀察碘液顏色變化","讓葉片產生澱粉","讓葉片變軟好剪","殺死細菌"],"a":0,"e":"酒精可溶解葉綠素，葉片變白後才看得清楚碘液反應。酒精易燃，所以要隔水加熱。"},{"s":"生物","r":"2-4","q":"關於膽汁的敘述，哪一項正確？","o":["可以使脂肪乳化，幫助消化","負責消化蛋白質","由膽囊製造","含有消化酵素"],"a":0,"e":"膽汁由肝臟製造、儲存在膽囊；不含酵素，能把脂肪乳化成小油滴。"},{"s":"生物","r":"2-4","q":"小腸內壁有許多絨毛，這有什麼好處？","o":["增加表面積，有利於吸收養分","讓食物走得更快","儲存食物","分泌膽汁"],"a":0,"e":"絨毛大大增加小腸內表面積，吸收養分更有效率。"},{"s":"生物","r":"3-1～3-2","q":"植物體內的水分主要從葉片的哪裡散失到空氣中（蒸散作用）？","o":["根毛","花瓣","氣孔","韌皮部"],"a":2,"e":"蒸散作用：水分以水蒸氣的形式主要從氣孔散失。"},{"s":"生物","r":"3-3","q":"人體心臟中，把含氧量高的血液送往全身的是哪一個腔室？","o":["右心室","右心房","左心房","左心室"],"a":3,"e":"左心室壁最厚，收縮時把充氧血經主動脈送往全身。"},{"s":"生物","r":"3-3","q":"血液和身體細胞之間的物質交換，主要在哪一種血管進行？","o":["微血管","主動脈","靜脈","動脈"],"a":0,"e":"微血管管壁很薄，是物質交換的場所。"},{"s":"生物","r":"3-4","q":"接種疫苗主要能讓人體產生什麼效果？","o":["讓身體預先產生抗體與記憶，日後遇到同種病原體能快速抵抗","增加紅血球數量","直接殺死體內所有細菌","讓血液循環變快"],"a":0,"e":"疫苗刺激身體產生抗體與記憶細胞。"},{"s":"生物","r":"3-4","q":"生病時，脖子的淋巴結常常會腫大，最可能的原因是什麼？","o":["淋巴結裡積了水","淋巴結正在製造血小板","淋巴結中的白血球正在對抗病原體","淋巴結在消化食物"],"a":2,"e":"淋巴結含大量白血球，對抗病原體時會腫大。"},{"s":"生物","r":"2-4","q":"人自己不能製造養分，必須從食物獲得，屬於哪一類生物？","o":["自營生物","兩者都不是","異營生物","兩者都是"],"a":2,"e":"植物能行光合作用自己製造養分是自營；人和動物是異營。"}]},{"no":"卷四","lv":"進階","ver":"段考2-卷四(進階)","Q":[{"s":"國文","r":"L4 論語選","q":"曾子「吾日三省吾身」，每天反省的事「不包括」下列哪一項？","o":["老師傳授的學問是否複習","替人謀劃事情是否盡心","是否孝順父母","和朋友交往是否誠信"],"a":2,"e":"三省：為人謀而不忠乎？與朋友交而不信乎？傳不習乎？沒有提到孝順。"},{"s":"國文","r":"L4 論語選","q":"「傳不習乎？」句中的「傳」是什麼意思？","o":["傳說","老師傳授的學問","傳記","傳遞消息"],"a":1,"e":"傳：讀 ㄔㄨㄢˊ，老師傳授的知識學問。"},{"s":"國文","r":"L4 論語選","q":"「敏而好學，不恥下問」中，「不恥下問」是什麼意思？","o":["不以向地位或學問比自己低的人請教為羞恥","不好意思問問題","只問比自己厲害的人","問問題很可恥"],"a":0,"e":"不恥下問：願意向任何人請教，不覺得丟臉，表示謙虛好學。"},{"s":"國文","r":"L4 論語選","q":"「由，誨女知之乎？」句中的「女」是什麼意思？","o":["你","如果","他","女子"],"a":0,"e":"「女」通「汝」，讀 ㄖㄨˇ，意思是「你」。由是子路的名字。"},{"s":"國文","r":"L5 背影","q":"〈背影〉全文中，作者一共流了幾次眼淚？","o":["五次","四次","三次","兩次"],"a":1,"e":"四次：在徐州看到家中景況；看父親買橘子的背影；父親背影消失在人群中；讀父親來信。"},{"s":"國文","r":"L5 背影","q":"〈背影〉開頭先寫「我最不能忘記的是他的背影」，再回頭敘述當年的事，這是哪一種寫作手法？","o":["插敘法","順敘法","補敘法","倒敘法"],"a":3,"e":"先寫結果或現在的感受，再回頭敘述往事，是倒敘法。"},{"s":"國文","r":"L5 背影","q":"父親來信說「大約大去之期不遠矣」，「大去」是什麼意思？","o":["搬到大城市","死亡、離開人世","長大","出遠門"],"a":1,"e":"大去：一去不回，指死亡。父親覺得自己身體不好，來日不多。"},{"s":"國文","r":"L5 背影","q":"作者回想時說「我那時真是聰明過分」，真正的意思是什麼？","o":["說茶房很聰明","覺得父親不夠聰明","稱讚自己很聰明","後悔當時自以為是，不懂父親的關愛"],"a":3,"e":"這是反話，表達自責與懊悔：當時自以為聰明，暗笑父親，其實不懂父愛。"},{"s":"國文","r":"L6 心囚","q":"依照〈心囚〉的觀點，下列哪一個人最可能是「被自己的心囚禁」的人？","o":["搬到新環境主動交朋友的人","生病仍努力讀書的人","因為害怕失敗，從不敢嘗試新事物的人","坐輪椅仍熱心參加活動的人"],"a":2,"e":"心囚是被自己的恐懼、成見困住。其他三位雖有限制，心靈卻是自由的。"},{"s":"國文","r":"L5 背影","q":"「他用兩手攀著上面，兩腳再向上縮；他肥胖的身子向左微傾，顯出努力的樣子。」這段文字主要運用了哪一種寫作技巧？","o":["譬喻","摹寫（視覺）","誇飾","排比"],"a":1,"e":"把父親爬月臺的動作具體描繪出來，讓讀者彷彿看見，是視覺摹寫。"},{"s":"英文","r":"U3","q":"Please give ____ the book. I want to read it.","o":["mine","my","I","me"],"a":3,"e":"give 後面接受格 me。"},{"s":"英文","r":"U3","q":"Look at ____. They are so cute.","o":["them","their","theirs","they"],"a":0,"e":"介系詞 at 後面接受格；they 的受格是 them。"},{"s":"英文","r":"U4","q":"A: Is Linda singing?\nB: No, she ____. She's dancing.","o":["can't","isn't","don't","doesn't"],"a":1,"e":"用 Is 問，否定簡答 No, she isn't."},{"s":"英文","r":"U4","q":"A: What ____ your brothers doing?\nB: They're playing games.","o":["do","are","does","is"],"a":1,"e":"your brothers 是複數 → What are … doing?"},{"s":"英文","r":"U5","q":"My birthday is on the ____ of May.（5）","o":["fifeth","fifth","five","fiveth"],"a":1,"e":"five 的序數是 fifth（ve 改成 f 加 th）。"},{"s":"英文","r":"U6","q":"把 \"There are some apples on the table.\" 改成問句，哪一個正確？","o":["Is there some apples on the table?","Are there any apples on the table?","There are any apples on the table?","Are there some apple on the table?"],"a":1,"e":"There are 改問句：Are there…？，some 在問句中改成 any。"},{"s":"英文","r":"U6","q":"There isn't ____ milk in the fridge.","o":["many","some","any","a"],"a":2,"e":"否定句中用 any；milk 不可數，不能用 a 或 many。"},{"s":"英文","r":"U6","q":"A: How many days are there in a week?\nB: ____","o":["It's seven.","There is seven.","They are seven.","There are seven."],"a":3,"e":"How many … are there？ 回答 There are + 數字。"},{"s":"英文","r":"U3","q":"A: Let's play basketball after school.\nB: ____","o":["I'm fine.","You're welcome.","Nice to meet you.","Sounds good!"],"a":3,"e":"對方提議時，同意可以說 Sounds good! / OK. / Good idea!"},{"s":"英文","r":"U3","q":"Don't ____ in class.","o":["talking","talks","talk","to talk"],"a":2,"e":"Don't + 原形動詞。"},{"s":"數學","r":"2-1","q":"若 2ᵃ × 3ᵇ = 72，則 a + b = ？","o":["4","5","6","7"],"a":1,"e":"72 = 2³ × 3²，a = 3、b = 2，a + b = 5。"},{"s":"數學","r":"2-2","q":"48 和 72 的最小公倍數是多少？","o":["288","3456","144","24"],"a":2,"e":"48 = 2⁴×3，72 = 2³×3²，最小公倍數 = 2⁴×3² = 144。"},{"s":"數學","r":"2-2","q":"a 和 b 的最大公因數是 6，最小公倍數是 72。若 a = 18，則 b = ？","o":["12","24","4","36"],"a":1,"e":"兩數相乘 ＝ 最大公因數 × 最小公倍數：18 × b = 6 × 72，b = 24。"},{"s":"數學","r":"2-1","q":"72 一共有幾個正因數？","o":["8 個","24 個","12 個","10 個"],"a":2,"e":"72 = 2³ × 3²，正因數個數 = (3+1)×(2+1) = 12。"},{"s":"數學","r":"2-3","q":"計算：(−1/2) + 3/4 × (−2/3) = ？","o":["−1/6","0","1/6","−1"],"a":3,"e":"先乘後加：3/4 × (−2/3) = −1/2；−1/2 + (−1/2) = −1。"},{"s":"數學","r":"2-4","q":"計算：(−2/3)² = ？","o":["4/3","−4/3","−4/9","4/9"],"a":3,"e":"(−2/3)×(−2/3) = 4/9，負負得正。"},{"s":"數學","r":"2-4","q":"2⁵ × 4² = ？","o":["2⁹","2⁷","2¹⁰","8⁷"],"a":0,"e":"4² = (2²)² = 2⁴，2⁵ × 2⁴ = 2⁹。"},{"s":"數學","r":"2-4","q":"計算：(3²)³ ÷ 3⁴ = ？","o":["9","81","27","3"],"a":0,"e":"(3²)³ = 3⁶，3⁶ ÷ 3⁴ = 3² = 9。"},{"s":"數學","r":"2-2","q":"老師有 48 顆糖和 60 片餅乾，要平分給一些學生，且都沒有剩下。最多可以分給幾位學生？","o":["12","24","240","6"],"a":0,"e":"人數要同時整除 48 和 60，最多就是最大公因數 12。"},{"s":"數學","r":"2-2","q":"1 到 50 的整數中，同時是 4 和 6 的倍數的數有幾個？","o":["4","3","12","8"],"a":0,"e":"同時是 4 和 6 的倍數 ＝ 12 的倍數：12、24、36、48，共 4 個。"},{"s":"生物","r":"2-3","q":"關於植物的光合作用和呼吸作用，哪一項正確？","o":["只有葉子會進行呼吸作用","植物白天和晚上都會進行呼吸作用","植物白天不呼吸","植物晚上進行光合作用"],"a":1,"e":"呼吸作用全天都在進行；光合作用只在有光時進行。"},{"s":"生物","r":"2-4","q":"哪一種消化液可以消化醣類、蛋白質和脂質三大類養分？","o":["膽汁","胃液","唾液","胰液"],"a":3,"e":"胰液含多種酵素，三大類養分都能消化。唾液只消化澱粉，胃液主要消化蛋白質，膽汁不含酵素。"},{"s":"生物","r":"2-4","q":"下列哪一個器官「不是」食物會通過的消化道？","o":["肝臟","小腸","胃","食道"],"a":0,"e":"肝臟是消化腺，分泌膽汁，但食物不會經過它。"},{"s":"生物","r":"3-1～3-2","q":"把樹幹剝去一圈樹皮（含韌皮部），一段時間後切口「上方」會腫大，原因是什麼？","o":["樹皮長太快","葉子製造的養分往下運送受阻而堆積","水分往上送不過去而堆積","根吸收太多水"],"a":1,"e":"韌皮部被切斷，養分無法往下運送，堆積在切口上方。水分走木質部，不受影響。"},{"s":"生物","r":"3-1～3-2","q":"玉米是單子葉植物，它的莖中維管束是怎麼排列的？","o":["散生排列","沒有維管束","只有木質部","環狀排列"],"a":0,"e":"單子葉植物莖的維管束散生；雙子葉植物則排成環狀。"},{"s":"生物","r":"3-3","q":"肺動脈裡流的是哪一種血液？","o":["缺氧血","組織液","充氧血","淋巴液"],"a":0,"e":"肺動脈把右心室的缺氧血送到肺部交換氣體，所以是缺氧血（動脈不一定是充氧血）。"},{"s":"生物","r":"3-3","q":"靜脈中的瓣膜有什麼功能？","o":["製造血球","讓血管變粗","防止血液倒流","過濾病菌"],"a":2,"e":"靜脈血壓低，瓣膜可以防止血液倒流。"},{"s":"生物","r":"3-3","q":"用手指按在手腕上測量脈搏，可以得知什麼？","o":["呼吸次數","心跳次數","體溫","血糖高低"],"a":1,"e":"脈搏是心臟搏動推動血液使動脈跳動，次數和心跳相同。"},{"s":"生物","r":"3-4","q":"得過水痘的人，通常不會再得水痘，主要原因是什麼？","o":["皮膚變厚了","體內已有對抗水痘病毒的抗體與記憶細胞","水痘病毒已經滅絕","紅血球變多了"],"a":1,"e":"第一次感染後，身體會記住這種病原體，下次能快速產生抗體。"},{"s":"生物","r":"3-4","q":"愛滋病毒（HIV）主要破壞人體的哪一個系統？","o":["呼吸系統","消化系統","免疫系統","骨骼系統"],"a":2,"e":"HIV 攻擊白血球（淋巴球），使免疫力下降。"}]},{"no":"卷五","lv":"挑戰","ver":"段考2-卷五(挑戰)","Q":[{"s":"國文","r":"L4 論語選","q":"下列《論語》文句和意思的配對，哪一項「錯誤」？","o":["學而不思則罔：只思考不學習會有危險","見賢思齊：看到賢人想向他看齊","人不知而不慍：別人不了解自己也不生氣","溫故而知新：從舊知識中得到新體會"],"a":0,"e":"學而不思則罔：只學不思會迷惑。「只思考不學習」是「思而不學則殆」。"},{"s":"國文","r":"L4 論語選","q":"「知之為知之，不知為不知，是知也。」句中哪一個「知」讀作 ㄓˋ，意思是「智慧」？","o":["「是知也」的「知」","「不知」的「知」","「為知之」的「知」","第一個「知之」的「知」"],"a":0,"e":"「是知也」的「知」通「智」，讀 ㄓˋ；其他都是「知道」的意思。"},{"s":"國文","r":"L4 論語選","q":"「不亦說乎？」「不亦樂乎？」「不亦君子乎？」這三句用的是哪一種語氣？","o":["單純的感嘆，沒有問句","命令別人去做","表面是問句，答案就在問題的反面（激問）","真的不知道答案而發問"],"a":2,"e":"激問：用反問加強語氣，「不是很快樂嗎？」意思就是「很快樂」。"},{"s":"國文","r":"L5 背影","q":"「他終於不放心，怕茶房不妥貼；頗躊躇了一會。」「躊躇」是什麼意思？","o":["生氣","快速決定","傷心流淚","猶豫不決"],"a":3,"e":"躊躇：猶豫、拿不定主意。父親在想到底要不要親自送兒子。"},{"s":"國文","r":"L5 背影","q":"「父親的差使也交卸了」這句話說明父親當時的處境是什麼？","o":["生了重病","升官了","失去了工作","去旅行"],"a":2,"e":"差使：工作職務；交卸：卸下職務。父親失業，家中經濟困難。"},{"s":"國文","r":"L5 背影","q":"文章最後，作者「在晶瑩的淚光中」又看見父親的背影，是因為什麼？","o":["在車站又遇見父親","讀到父親來信說身體不好、自覺不久於人世","想起祖母過世","看到別人買橘子"],"a":1,"e":"父親來信提到「大去之期不遠矣」，作者讀信時想起父親的背影而落淚。"},{"s":"國文","r":"L5 背影","q":"作者為什麼選擇「背影」，而不寫父親的正面表情來表現父愛？","o":["因為父親長得不好看","背影更能表現父親默默付出、含蓄深沉的愛","因為背影比較容易描寫","因為作者沒看到父親的臉"],"a":1,"e":"父親不善言詞，愛是默默的行動。背影象徵這份含蓄的父愛，也留給讀者想像。"},{"s":"國文","r":"L5 背影","q":"在徐州，父親對作者說：「事已如此，不必難過，好在天無絕人之路！」這句話表現父親的哪一種態度？","o":["責怪兒子","雖然遭遇困境，仍堅強面對並安慰兒子","準備放棄一切","抱怨命運不公平"],"a":1,"e":"父親自己正面臨喪母、失業，卻反過來安慰兒子，表現堅強與慈愛。"},{"s":"國文","r":"L6 心囚","q":"杏林子的人生經歷和〈心囚〉主旨有什麼關係？","o":["她主張人要待在家裡","她的身體行動受限，卻以心靈的自由鼓勵別人突破自我限制","她坐過牢，所以寫監獄生活","她身體健康，所以不懂病痛"],"a":1,"e":"作者長年受病痛限制，卻活得積極自由，親身證明「心」才是最重要的。"},{"s":"國文","r":"綜合 L4～L6","q":"下列有關本次範圍課文的敘述，哪一項正確？","o":["〈背影〉以父親買橘子時的背影為描寫重點","〈心囚〉是一首童詩","《論語》是孔子親自寫成的","〈背影〉的作者是胡適"],"a":0,"e":"〈背影〉作者朱自清；《論語》由弟子編纂；〈心囚〉是散文。"},{"s":"英文","r":"Review 2","q":"下列哪一個句子「正確」？","o":["Let's go to the zoo.","Don't is noisy.","Tom are running.","She can sings well."],"a":0,"e":"can 後接原形（sing）；Don't be noisy；Tom is running。"},{"s":"英文","r":"U5","q":"A: ____ is Father's Day in Taiwan?\nB: It's on August 8th.","o":["Who","What","Where","When"],"a":3,"e":"回答是日期，問「什麼時候」用 When。"},{"s":"英文","r":"U6","q":"It's Sunday. There ____ any students in the classroom now.","o":["isn't","doesn't","don't","aren't"],"a":3,"e":"students 是複數，否定用 There aren't any…。"},{"s":"英文","r":"U4","q":"Listen! Someone ____ in the next room.","o":["sings","is singing","are singing","sing"],"a":1,"e":"Listen! 表示正在發生；someone 視為單數 → is singing。"},{"s":"英文","r":"U3","q":"A: ____ he swim?\nB: Yes, he can.","o":["Does","Do","Is","Can"],"a":3,"e":"回答用 he can，問句用 Can 開頭。"},{"s":"英文","r":"U5","q":"Today is March 21st. Tomorrow is March ____.","o" "(−1)²ⁿ = 1"],"a":3,"e":"2n 一定是偶數，−1 的偶數次方是 1；2n+1 是奇數，結果是 −1。"},{"s":"數學","r":"2-2","q":"用大小相同的正方體積木，剛好填滿長 12、寬 18、高 30 公分的箱子。積木要盡量大，最少需要幾塊？","o":["6","6480","180","30"],"a":3,"e":"邊長取 12、18、30 的最大公因數 6；(12÷6)×(18÷6)×(30÷6) = 2×3×5 = 30 塊。"},{"s":"數學","r":"2-2","q":"甲、乙、丙三盞燈分別每 6 秒、8 秒、10 秒閃一次。三盞燈同時閃一次後，接下來的 3 分鐘內還會再同時閃幾次？","o":["3 次","1 次","2 次","0 次"],"a":1,"e":"6、8、10 的最小公倍數是 120 秒。3 分鐘 = 180 秒，只有第 120 秒會同時閃，共 1 次。"},{"s":"生物","r":"2-3","q":"遮光實驗中，照光部分有澱粉、遮光部分沒有澱粉，可以推論出什麼？","o":["光合作用需要光","光合作用會產生氧氣","光合作用需要水","光合作用需要二氧化碳"],"a":0,"e":"唯一不同的變因是「有沒有照光」，所以可推論光合作用需要光。"},{"s":"生物","r":"2-3","q":"光合作用實驗前，要先把植物放在暗處一天，目的是什麼？","o":["讓葉片原有的澱粉消耗掉","讓葉綠素變多","讓氣孔關閉","讓植物休息"],"a":0,"e":"先消耗掉原有澱粉，才能確定實驗後的澱粉是照光時新產生的。"},{"s":"生物","r":"2-4","q":"下列哪一項屬於「化學性消化」？","o":["牙齒咀嚼食物","唾液中的酵素把澱粉分解","膽汁使脂肪乳化","胃的蠕動"],"a":1,"e":"化學性消化要靠酵素改變物質成分。咀嚼、蠕動、乳化只是變小或混合，屬於物理性消化。"},{"s":"生物","r":"2-4","q":"下列「養分 → 最後分解成的小分子」配對，哪一項「錯誤」？","o":["澱粉 → 葡萄糖","蛋白質 → 葡萄糖","脂質 → 脂肪酸和甘油","蛋白質 → 胺基酸"],"a":1,"e":"蛋白質最後分解成胺基酸，不是葡萄糖。"},{"s":"生物","r":"3-1～3-2","q":"蒸散作用對植物的好處「不包括」下列哪一項？","o":["降低葉片溫度","直接製造葡萄糖","幫助水分向上運輸","幫助礦物質向上運送"],"a":1,"e":"製造葡萄糖是光合作用；蒸散作用產生拉力，幫助水分和礦物質上升，也能降溫。"},{"s":"生物","r":"3-3","q":"從手臂靜脈注射藥物後，藥物最先到達心臟的哪一個腔室？","o":["左心房","右心房","左心室","右心室"],"a":1,"e":"靜脈血經大靜脈回到右心房，再到右心室、肺動脈。"},{"s":"生物","r":"3-3","q":"關於「體循環」的路徑，哪一項正確？","o":["從右心室出發，回到左心房","從右心房出發，回到左心室","從左心室出發，回到右心房","從左心房出發，回到右心室"],"a":2,"e":"體循環：左心室 → 主動脈 → 全身 → 大靜脈 → 右心房。"},{"s":"生物","r":"3-3","q":"關於微血管的敘述，哪一項「錯誤」？","o":["是物質交換的場所","管壁最厚，而且有瓣膜","管壁只有一層細胞","血流速度最慢"],"a":1,"e":"管壁最厚的是動脈；有瓣膜的是靜脈。微血管管壁最薄。"},{"s":"生物","r":"3-4","q":"皮膚受傷後紅、腫、熱、痛，白血球聚集吞噬細菌，這屬於第幾道防線？","o":["不屬於防線","第三道防線","第一道防線","第二道防線"],"a":3,"e":"發炎反應、白血球吞噬屬於第二道防線；第三道是產生抗體的專一性防禦。"},{"s":"生物","r":"3-4","q":"被毒蛇咬傷後要立刻注射抗蛇毒血清，原因是什麼？","o":["血清可以讓身體慢慢產生抗體","血清中已含有抗體，可以立即中和毒素","血清能增加紅血球","血清會讓傷口變小"],"a":1,"e":"血清直接提供現成抗體，作用快但效果不持久；疫苗則是讓身體自己產生抗體。"}]}];

function useAtt(a){const p=a&&paperByVer(a.ver);if(p)Q=p.Q;return p;}
const STARS=['★☆☆☆☆','★★☆☆☆','★★★☆☆','★★★★☆','★★★★★'];
const L='ABCD';

// ===== 設定 =====
// ↓↓↓ 把 Apps Script「網頁應用程式」網址貼在引號裡 ↓↓↓
const GAS_URL='https://script.google.com/macros/s/AKfycbxxg7dcRkr8JB1NGS1214o8X-ZAA36Go8ATeg3SIxyIi-Vimu0L9r4_xaWBrTpRan_B/exec';
// ↑↑↑
const USERS=['白豬緁','花豬縈'];

// ===== 儲存：Google 試算表（離線時先存手機，連線後自動上傳）=====
const LS={user:'g7_user',cache:'g7_cache',queue:'g7_queue'};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
let user=lsGet(LS.user,null); if(!USERS.includes(user)) user=null;
let all=lsGet(LS.cache,{attempts:[],corrections:[]});
let queue=lsGet(LS.queue,[]);
let store={attempts:[],corrections:[]};
let sync='init'; // init | loading | ok | offline | nourl
let flushing=false;
let lastErr='';
function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb='__g'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
    const s=document.createElement('script');
    const done=()=>{clearTimeout(tm);try{delete window[cb];}catch(_){window[cb]=undefined;}s.remove();};
    const tm=setTimeout(()=>{done();reject(new Error('連線逾時'));},20000);
    window[cb]=d=>{done();resolve(d);};
    s.onerror=()=>{done();reject(new Error('連不到 Apps Script（請確認已部署新版本）'));};
    const q=Object.entries(Object.assign({},params,{callback:cb,t:Date.now()})).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&');
    s.src=GAS_URL+'?'+q;
    document.head.appendChild(s);
  });
}
const gasReady=()=>/^https:\/\/script\.google(usercontent)?\.com\//.test(GAS_URL);

function refreshStore(){
  const by=(p,q)=>q.ts-p.ts;
  store={attempts:all.attempts.filter(a=>a.user===user).sort(by),
         corrections:all.corrections.filter(c=>c.user===user).sort(by)};
}
function persist(){lsSet(LS.cache,all);lsSet(LS.queue,queue);}
refreshStore();

async function flush(){
  if(!gasReady()){sync='nourl';updSync();return;}
  if(flushing)return; flushing=true;
  while(queue.length){
    try{
      const j=await jsonp({action:'add',data:JSON.stringify(queue[0])});
      if(!j.ok) throw new Error('試算表回報錯誤：'+(j.error||'未知'));
      queue.shift(); persist(); lastErr='';
    }catch(e){sync='offline';lastErr='上傳失敗：'+(e.message||e);break;}
  }
  flushing=false;
  if(!queue.length&&sync!=='loading') sync='ok';
  updSync();
}
async function pull(){
  if(!gasReady()){sync='nourl';updSync();return;}
  sync='loading';updSync();
  try{
    const j=await jsonp({});
    if(!j||!j.ok) throw new Error('試算表回報錯誤：'+((j&&j.error)||'未知'));
    const merge=(srv,type)=>{
      const m=new Map(); (srv||[]).forEach(x=>x&&x.id&&m.set(x.id,x));
      queue.filter(q=>q.type===type).forEach(q=>m.set(q.rec.id,q.rec));
      return [...m.values()];
    };
    all={attempts:merge(j.attempts,'attempt'),corrections:merge(j.corrections,'correction')};
    persist(); refreshStore();
    sync=queue.length?'offline':'ok';
    if(['home','records'].includes(view.name)) render(); else updSync();
  }catch(e){sync='offline';lastErr='讀取失敗：'+(e.message||e);updSync();}
}
function syncText(){
  if(sync==='nourl')return '⚠️ 尚未設定試算表網址，紀錄只存在這支手機';
  if(sync==='loading'||sync==='init')return '⏳ 正在讀取試算表紀錄…';
  if(queue.length)return `⚠️ 有 ${queue.length} 筆紀錄還沒上傳，連上網路會自動補傳`;
  if(sync==='offline')return '⚠️ 連不到試算表，目前顯示手機裡的紀錄';
  return '✅ 紀錄已同步到 Google 試算表';
}
function updSync(){const el=document.getElementById('sync');if(!el)return;
  el.innerHTML=esc(syncText())+((queue.length||sync==='offline')&&gasReady()?
    `<br><button class="link" onclick="retrySync()">重新上傳</button>${lastErr?`<div style="margin-top:6px;color:#c8372d;font-size:12px;word-break:break-all">${esc(lastErr)}</div>`:''}`:'');}
function retrySync(){lastErr='';sync='loading';updSync();flush().then(pull);}

async function saveDoc(col,obj){
  obj.user=user;
  all[col].unshift(obj);
  queue.push({type:col==='attempts'?'attempt':'correction',rec:obj});
  persist(); refreshStore(); flush();
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}

// ===== 工具 =====
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtTime(ts){const d=new Date(ts);const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function fmtDur(s){const m=Math.floor(s/60),r=s%60;return m?`${m} 分 ${r} 秒`:`${r} 秒`;}
function subjColor(k){return SUBJ.find(x=>x.k===k).c;}
function fixedSet(attemptId){ // 已訂正成功的題目
  const s=new Set();
  store.corrections.filter(c=>c.attemptId===attemptId).forEach(c=>c.items.forEach(it=>{if(it.ok)s.add(it.qid);}));
  return s;}
function pendingOf(att){if(!paperByVer(att.ver))return [];const f=fixedSet(att.id);return att.wrong.filter(q=>!f.has(q));}
function modal(html){$('#modalBox').innerHTML=html;$('#modal').classList.add('on');}
function closeModal(){$('#modal').classList.remove('on');}
function bottom(html){if(html){$('#bottomInner').innerHTML=html;$('#bottom').classList.remove('hidden');}else $('#bottom').classList.add('hidden');}

// ===== 狀態 =====
let view={name:'home'};
let exam=null; // {answers:[], start}
let corr=null; // {attemptId, qids, answers:{}, done}

function go(name,extra){view=Object.assign({name},extra||{});render();window.scrollTo(0,0);}

function render(){
  const f={home,exam:examView,result,review,correct:correctView,records}[view.name];
  f();
}

// ===== 首頁 =====

  bottom(null);
  if(!user){
    $('#app').innerHTML=`<h1>喜羊羊測驗區</h1><div style="font-weight:700;margin-bottom:4px">國一第二次段考模擬</div><div class="muted">請先選擇作答者</div>
    ${USERS.map(u=>`<button class="btn" style="padding:20px;font-size:20px" onclick="setUser('${u}')">${u}</button>`).join('')}
    <div class="note" id="sync"></div>`;
    updSync();return;
  }
  const last=store.attempts[0];
  const pend=store.attempts.reduce((n,a)=>n+pendingOf(a).length,0);
  $('#app').innerHTML=`
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">
    <div style="font-size:18px">作答者：<b>${esc(user)}</b></div>
    <button class="link" onclick="askSwitch()">切換作答者</button></div>
  <h1>喜羊羊測驗區</h1><div style="font-weight:700;margin-bottom:4px">國一第二次段考模擬</div>
  <div class="muted">範圍：國文 L4～L6（翰林）、英語 U3～Review2（翰林）、數學第 2 章（康軒）、自然 2-3～3-4（康軒）<br>每卷國英數生各 10 題，共 40 題，每題 2.5 分。卷一最簡單，卷五最難。</div>
  ${exam?`<div class="card">${PAPERS[exam.paper].no}（${PAPERS[exam.paper].lv}）作答到一半（已答 ${exam.answers.filter(x=>x!=null).length}/40）
    <button class="btn" onclick="go('exam')">繼續作答</button></div>`:''}
  <h2>選擇考卷</h2>
  ${PAPERS.map((p,i)=>{const at=store.attempts.filter(x=>x.ver===p.ver);const best=at.length?Math.max(...at.map(x=>x.score)):null;
    const pd=at.reduce((n,x)=>n+pendingOf(x).length,0);
    return `<button class="card" style="display:block;width:100%;text-align:left;font-family:inherit;cursor:pointer;margin:10px 0" onclick="pickPaper(${i})">
      <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:19px">${p.no}　${p.lv}</b><span style="color:#d08a00">${STARS[i]}</span></div>
      <div class="muted">${at.length?`考過 ${at.length} 次・最高 ${best} 分`:'還沒考過'}${pd?`　<span class="tag pend">待訂正 ${pd}</span>`:''}</div></button>`;}).join('')}
  <button class="btn sec" onclick="go('records',{tab:'att'})">作答紀錄（${store.attempts.length} 次）</button>
  <button class="btn sec" onclick="go('records',{tab:'cor'})">訂正紀錄（${store.corrections.length} 次）</button>
  ${last?`<div class="card"><div class="muted">上一次：${fmtTime(last.ts)}</div>
    <div style="font-size:22px;font-weight:800">${last.score} 分</div>
    <div class="muted">${SUBJ.map(s=>`${s.k} ${last.per[s.k]}/10`).join('　')}</div>
    ${pend?`<div style="margin-top:8px"><span class="tag pend">待訂正共 ${pend} 題</span></div>`:''}</div>`:''}
  <div class="note" id="sync"></div>`;
  updSync();
}
function setUser(u){user=u;lsSet(LS.user,u);exam=null;corr=null;refreshStore();go('home');}
function askSwitch(){
  modal(`<h2 style="margin-top:0">切換作答者</h2>
    ${exam?'<div class="muted" style="margin-bottom:8px">目前作答到一半的考卷會清除。</div>':''}
    ${USERS.map(u=>`<button class="btn ${u===user?'ghost':''}" onclick="closeModal();setUser('${u}')">${u}${u===user?'（目前）':''}</button>`).join('')}
    <button class="btn ghost" onclick="closeModal()">取消</button>`);
}

function pickPaper(i){
  if(exam){modal(`<h2 style="margin-top:0">開始${PAPERS[i].no}？</h2><div class="muted">目前作答到一半的${PAPERS[exam.paper].no}會清除。</div>
    <div class="row"><button class="btn ghost" onclick="closeModal()">取消</button><button class="btn" onclick="closeModal();startExam(${i})">開始</button></div>`);return;}
  startExam(i);
}
function startExam(i){
  exam={paper:i,answers:Array(40).fill(null),start:Date.now()};
  go('exam');
}

// ===== 作答 =====
function examView(){
  const P=PAPERS[exam.paper];Q=P.Q;
  const ans=exam.answers;
  let h=`<div class="topbar"><div style="display:flex;justify-content:space-between;align-items:center">
    <b>${P.no}（${P.lv}）作答中</b><span class="muted" id="cnt"></span></div>
    <div class="prog"><i id="pbar"></i></div>
    <div class="tabs">${SUBJ.map(s=>`<a href="#" onclick="jump('${s.k}');return false" style="border-color:${s.c}">${s.k}</a>`).join('')}</div></div>`;
  SUBJ.forEach(s=>{
    h+=`<div class="subj" id="sec-${s.k}" style="--sc:${s.c}">${s.k}</div>`;
    Q.filter(q=>q.s===s.k).forEach(q=>{
      h+=`<div class="card q" id="q${q.id}"><div class="qn">第 ${q.id+1} 題　<span class="tag" style="background:#f0eee8">${q.r}</span></div><div class="qt">${esc(q.q)}</div>
      ${q.o.map((o,i)=>`<button class="opt ${ans[q.id]===i?'sel':''}" onclick="pick(${q.id},${i})"><b>${L[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>`;
    });
  });
  h+=`<button class="btn ghost" onclick="go('home')">回首頁（作答會保留）</button>`;
  $('#app').innerHTML=h;
  bottom(`<button class="btn" style="margin:0" onclick="trySubmit()">交卷</button>`);
  updProg();
}
function jump(k){const el=document.getElementById('sec-'+k);if(el)window.scrollTo({top:el.offsetTop-120,behavior:'smooth'});}
function pick(qid,i){
  exam.answers[qid]=i;
  const card=document.getElementById('q'+qid);
  card.classList.remove('unans');
  card.querySelectorAll('.opt').forEach((b,j)=>b.classList.toggle('sel',j===i));
  updProg();
}
function updProg(){
  const n=exam.answers.filter(x=>x!=null).length;
  $('#cnt').textContent=`已答 ${n} / 40`;$('#pbar').style.width=(n/40*100)+'%';
}
function trySubmit(){
  const miss=exam.answers.map((a,i)=>a==null?i:-1).filter(i=>i>=0);
  if(miss.length){
    miss.forEach(i=>document.getElementById('q'+i).classList.add('unans'));
    modal(`<h2 style="margin-top:0">還有 ${miss.length} 題沒作答</h2>
      <div class="muted">第 ${miss.map(i=>i+1).join('、')} 題</div>
      <button class="btn" onclick="closeModal();toQ(${miss[0]})">回去作答</button>
      <button class="btn ghost" onclick="closeModal();submitExam()">直接交卷（未答算錯）</button>`);
  }else{
    modal(`<h2 style="margin-top:0">確定要交卷嗎？</h2><div class="muted">交卷後就不能修改答案。</div>
      <div class="row"><button class="btn ghost" onclick="closeModal()">再檢查</button>
      <button class="btn" onclick="closeModal();submitExam()">交卷</button></div>`);
  }
}
function toQ(i){const el=document.getElementById('q'+i);window.scrollTo({top:el.offsetTop-130,behavior:'smooth'});}
async function submitExam(){
  const P=PAPERS[exam.paper];Q=P.Q;
  const ans=exam.answers.slice();
  const per={};SUBJ.forEach(s=>per[s.k]=0);
  const wrong=[];
  Q.forEach(q=>{if(ans[q.id]===q.a)per[q.s]++;else wrong.push(q.id);});
  const correct=40-wrong.length;
  const att={id:uid(),ver:P.ver,paper:P.no,ts:Date.now(),dur:Math.round((Date.now()-exam.start)/1000),
    answers:ans.map(x=>x==null?-1:x),per,correct,score:Math.round(correct*2.5*10)/10,wrong};
  exam=null;
  await saveDoc('attempts',att);
  go('result',{id:att.id});
}

// ===== 成績 =====
function getAtt(id){return store.attempts.find(a=>a.id===id);}
function result(){
  const a=getAtt(view.id);if(!a)return go('home');
  const P=useAtt(a);if(!P)return go('home');
  bottom(null);
  const pend=pendingOf(a);
  $('#app').innerHTML=`
  <h1>成績</h1><div style="font-weight:700">${P.no}（${P.lv}）</div><div class="muted">${fmtTime(a.ts)}・作答時間 ${fmtDur(a.dur)}</div>
  <div class="card"><div class="big">${a.score}<span style="font-size:22px"> 分</span></div>
  <div style="text-align:center" class="muted">答對 ${a.correct} 題・答錯 ${a.wrong.length} 題</div></div>
  <div class="grid4">${SUBJ.map(s=>`<div class="tile" style="--sc:${s.c}"><div class="muted">${s.k}</div>
    <div class="n">${a.per[s.k]*10}<span style="font-size:14px"> 分</span></div><div class="muted">${a.per[s.k]}/10 題</div></div>`).join('')}</div>
  ${a.wrong.length?`<button class="btn" onclick="go('review',{id:'${a.id}',f:'wrong'})">檢視錯題（${a.wrong.length} 題）</button>
    ${pend.length?`<button class="btn okb" onclick="startCorr('${a.id}')">開始訂正（待訂正 ${pend.length} 題）</button>`:'<div class="card" style="text-align:center"><span class="tag ok">錯題已全部訂正完成</span></div>'}`
   :'<div class="card" style="text-align:center">全對！太厲害了 🎉</div>'}
  <button class="btn sec" onclick="go('review',{id:'${a.id}',f:'all'})">看全部 40 題詳解</button>
  <button class="btn ghost" onclick="go('home')">回首頁</button>`;
}

// ===== 檢視 =====
function review(){
  const a=getAtt(view.id);if(!a)return go('home');
  const P=useAtt(a);if(!P)return go('home');
  bottom(null);
  const fixed=fixedSet(a.id);
  const f=view.f||'wrong';
  const list=Q.filter(q=>f==='all'||a.wrong.includes(q.id));
  let h=`<h1>${f==='all'?'全部詳解':'錯題檢視'}</h1><div class="muted">${P.no}（${P.lv}）・${fmtTime(a.ts)}・${a.score} 分</div>
  <div class="seg"><button class="${f==='wrong'?'on':''}" onclick="go('review',{id:'${a.id}',f:'wrong'})">只看錯題 (${a.wrong.length})</button>
  <button class="${f==='all'?'on':''}" onclick="go('review',{id:'${a.id}',f:'all'})">全部 40 題</button></div>`;
  let cur='';
  list.forEach(q=>{
    if(q.s!==cur){cur=q.s;h+=`<div class="subj" style="--sc:${subjColor(q.s)}">${q.s}</div>`;}
    const my=a.answers[q.id],ok=my===q.a;
    h+=`<div class="card q"><div class="qn">第 ${q.id+1} 題　<span class="tag" style="background:#f0eee8">${q.r}</span>
      ${ok?'<span class="tag ok">答對</span>':`<span class="tag bad">${my<0?'未作答':'答錯'}</span>${fixed.has(q.id)?'<span class="tag ok">已訂正</span>':'<span class="tag pend">待訂正</span>'}`}</div>
      <div class="qt">${esc(q.q)}</div>
      ${q.o.map((o,i)=>`<button class="opt ${i===q.a?'right':(i===my?'wrong':'')}" disabled><b>${L[i]}</b><span>${esc(o)}${i===my&&!ok?'　← 你的答案':''}${i===q.a?'　✓ 正確答案':''}</span></button>`).join('')}
      <div class="exp">💡 ${esc(q.e)}</div></div>`;
  });
  if(!list.length)h+='<div class="card">沒有錯題 🎉</div>';
  const pend=pendingOf(a);
  if(pend.length)h+=`<button class="btn okb" onclick="startCorr('${a.id}')">開始訂正（${pend.length} 題）</button>`;
  h+=`<button class="btn sec" onclick="go('result',{id:'${a.id}'})">回成績</button><button class="btn ghost" onclick="go('home')">回首頁</button>`;
  $('#app').innerHTML=h;
}

// ===== 訂正 =====
function startCorr(attId){
  const a=getAtt(attId);useAtt(a);const qids=pendingOf(a);
  if(!qids.length)return go('result',{id:attId});
  corr={attemptId:attId,qids,answers:{},done:false,start:Date.now()};
  go('correct');
}
function correctView(){
  const a=getAtt(corr.attemptId);const P=useAtt(a);
  let h=`<h1>訂正</h1><div class="muted">${P.no}（${P.lv}）${fmtTime(a.ts)} 那次的錯題，共 ${corr.qids.length} 題。<br>先不看答案，重新作答一次。</div>`;
  corr.qids.forEach(id=>{
    const q=Q[id],my=corr.answers[id],old=a.answers[id];
    let opts;
    if(!corr.done){
      opts=q.o.map((o,i)=>`<button class="opt ${my===i?'sel':''}" onclick="cpick(${id},${i})"><b>${L[i]}</b><span>${esc(o)}</span></button>`).join('');
    }else{
      opts=q.o.map((o,i)=>`<button class="opt ${i===q.a?'right':(i===my?'wrong':'')}" disabled><b>${L[i]}</b><span>${esc(o)}${i===q.a?'　✓':''}</span></button>`).join('')
        +`<div class="exp">原本答 ${old<0?'未作答':L[old]}，訂正答 ${my==null?'未作答':L[my]}<br>💡 ${esc(q.e)}</div>`;
    }
    h+=`<div class="card q" id="c${id}"><div class="qn"><span class="tag" style="background:#f0eee8">${q.s}</span>第 ${id+1} 題　<span class="tag" style="background:#f0eee8">${q.r}</span>
      ${corr.done?(my===q.a?'<span class="tag ok">訂正成功</span>':'<span class="tag bad">還是錯</span>'):''}</div>
      <div class="qt">${esc(q.q)}</div>${opts}</div>`;
  });
  if(corr.done){
    const okN=corr.qids.filter(id=>corr.answers[id]===Q[id].a).length;
    const left=pendingOf(a).length;
    h+=`<div class="card" style="text-align:center"><b>訂正成功 ${okN} / ${corr.qids.length} 題</b><br>
      <span class="muted">${left?`還有 ${left} 題待訂正`:'這次考試的錯題全部訂正完成 🎉'}</span></div>
      ${left?`<button class="btn okb" onclick="startCorr('${a.id}')">再訂正剩下的 ${left} 題</button>`:''}
      <button class="btn sec" onclick="go('records',{tab:'cor'})">看訂正紀錄</button>
      <button class="btn ghost" onclick="corr=null;go('home')">回首頁</button>`;
    bottom(null);
  }else{
    h+=`<button class="btn ghost" onclick="corr=null;go('result',{id:'${a.id}'})">先不訂正，回成績</button>`;
    bottom(`<button class="btn okb" style="margin:0" id="csub" onclick="submitCorr()">送出訂正</button>`);
  }
  $('#app').innerHTML=h;
}
function cpick(id,i){corr.answers[id]=i;
  document.querySelectorAll('#c'+id+' .opt').forEach((b,j)=>b.classList.toggle('sel',j===i));}
async function submitCorr(){
  const miss=corr.qids.filter(id=>corr.answers[id]==null);
  if(miss.length){modal(`<h2 style="margin-top:0">還有 ${miss.length} 題沒作答</h2>
    <button class="btn" onclick="closeModal()">回去作答</button>`);return;}
  const items=corr.qids.map(id=>({qid:id,ans:corr.answers[id],ok:corr.answers[id]===Q[id].a}));
  const rec={id:uid(),ver:getAtt(corr.attemptId).ver,paper:useAtt(getAtt(corr.attemptId)).no,ts:Date.now(),attemptId:corr.attemptId,attemptTs:getAtt(corr.attemptId).ts,dur:Math.round((Date.now()-corr.start)/1000),
    items,okCount:items.filter(x=>x.ok).length,total:items.length};
  corr.done=true;
  await saveDoc('corrections',rec);
  render();window.scrollTo(0,0);
}

// ===== 紀錄 =====
function records(){
  bottom(null);
  const tab=view.tab||'att';
  let h=`<h1>紀錄</h1><div class="seg">
    <button class="${tab==='att'?'on':''}" onclick="go('records',{tab:'att'})">作答紀錄</button>
    <button class="${tab==='cor'?'on':''}" onclick="go('records',{tab:'cor'})">訂正紀錄</button>
    <button class="${tab==='stat'?'on':''}" onclick="go('records',{tab:'stat'})">錯題統計</button></div>`;
  if(tab==='att'){
    if(!store.attempts.length)h+='<div class="card muted">還沒有作答紀錄</div>';
    else{
      h+=`<div class="card" style="padding:8px 10px;overflow-x:auto"><table><tr><th>日期</th><th>卷</th><th>總分</th>${SUBJ.map(s=>`<th>${s.k}</th>`).join('')}<th>待訂正</th></tr>
      ${store.attempts.map(a=>{const p=pendingOf(a).length;const P=paperByVer(a.ver);const old=!P;return `<tr ${old?'style="opacity:.55"':`onclick="go('result',{id:'${a.id}'})" style="cursor:pointer"`}>
        <td style="font-size:13px">${fmtTime(a.ts).slice(5)}</td><td style="font-size:13px">${P?P.no:'舊'}</td><td><b>${a.score}</b></td>
        ${SUBJ.map(s=>`<td>${a.per[s.k]*10}</td>`).join('')}
        <td>${old?'<span class="tag">舊卷</span>':p?`<span class="tag pend">${p}</span>`:(a.wrong.length?'<span class="tag ok">完成</span>':'—')}</td></tr>`;}).join('')}
      </table></div><div class="muted" style="text-align:center">點任一列可看成績、錯題和訂正</div>`;
    }
  }else if(tab==='cor'){
    if(!store.corrections.length)h+='<div class="card muted">還沒有訂正紀錄</div>';
    store.corrections.filter(c=>paperByVer(c.ver)).forEach(c=>{
      const CP=paperByVer(c.ver);
      const a=getAtt(c.attemptId);
      h+=`<div class="card"><div style="display:flex;justify-content:space-between"><b>${fmtTime(c.ts)}</b>
        <span class="tag ${c.okCount===c.total?'ok':'pend'}">成功 ${c.okCount}/${c.total}</span></div>
        <div class="muted">${CP.no}・訂正的是 ${a?fmtTime(a.ts)+'（'+a.score+' 分）':'已刪除的考試'}・用時 ${fmtDur(c.dur||0)}</div>
        <div style="margin-top:6px;font-size:15px">${c.items.map(it=>{const q=CP.Q[it.qid];
          return `<div>${it.ok?'✅':'❌'} 第 ${it.qid+1} 題（${q.s}）答 ${L[it.ans]}${it.ok?'':`，正解 ${L[q.a]}`}</div>`;}).join('')}</div>
        ${a?`<button class="link" style="margin-top:6px" onclick="go('review',{id:'${a.id}',f:'wrong'})">看這次考試的錯題 →</button>`:''}</div>`;
    });
  }else{
    const cnt={};store.attempts.filter(a=>paperByVer(a.ver)).forEach(a=>a.wrong.forEach(id=>{const k=a.ver+'|'+id;cnt[k]=(cnt[k]||0)+1;}));
    const arr=Object.entries(cnt).sort((x,y)=>y[1]-x[1]);
    if(!arr.length)h+='<div class="card muted">還沒有錯題</div>';
    else{
      h+=`<div class="muted">所有考試中，最常錯的題目（共考 ${store.attempts.length} 次）</div>`;
      arr.forEach(([k,n])=>{const [v,id]=k.split('|');const SP=paperByVer(v);const q=SP.Q[id];
        h+=`<div class="card q"><div class="qn"><span class="tag" style="background:#f0eee8">${SP.no}・${q.s}</span>第 ${+id+1} 題　<span class="tag bad">錯 ${n} 次</span></div>
        <div class="qt">${esc(q.q)}</div><div class="exp">正解 ${L[q.a]}. ${esc(q.o[q.a])}<br>💡 ${esc(q.e)}</div></div>`;});
    }
  }
  h+=`<button class="btn ghost" onclick="go('home')">回首頁</button>`;
  $('#app').innerHTML=h;
}

$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
render();
flush().then(pull);
window.addEventListener('online',()=>flush().then(pull));
</script>
</body>
