<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shixianba看板</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Noto+Sans+TC:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#f5f0e8;--surface:#fdfaf4;--border:#e0d8c8;
    --accent-green:#c0392b;--accent-red:#1a7a5e;--accent-blue:#2c5f8a;--accent-yellow:#b8860b;
    --text-primary:#2a2118;--text-muted:#8a7a65;--text-dim:#c8bfaf;
    --font-mono:'DM Mono',monospace;--font-sans:'Noto Sans TC',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text-primary);font-family:var(--font-sans);min-height:100vh;padding:20px;}
  body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(var(--text-dim) 1px,transparent 1px),linear-gradient(90deg,var(--text-dim) 1px,transparent 1px);background-size:40px 40px;opacity:.35;pointer-events:none;z-index:0;}
  .container{max-width:940px;margin:0 auto;position:relative;z-index:1;}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;padding-bottom:14px;border-bottom:1px solid var(--border);}
  .logo{font-family:var(--font-mono);font-size:11px;letter-spacing:.2em;color:var(--text-muted);}
  .logo span{color:var(--accent-blue);}
  .section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
  .section-title{font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;color:var(--text-muted);text-transform:uppercase;}
  .oi-date{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);}
  .history-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 24px;margin-bottom:14px;box-shadow:0 2px 12px rgba(100,80,50,.07);}
  .up{color:var(--accent-green);}
  .down{color:var(--accent-red);}
  .neutral{color:var(--text-muted);}
  .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border);border-top-color:var(--accent-blue);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:5px;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── 週K線樣式 ── */
  .skline-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px;}
  .skline-stat{background:#f0ebe0;border:1px solid var(--border);border-radius:8px;padding:10px 12px;}
  .skline-stat-label{font-family:var(--font-mono);font-size:9px;letter-spacing:.1em;color:var(--text-muted);margin-bottom:4px;}
  .skline-stat-val{font-family:var(--font-mono);font-size:17px;font-weight:500;}
  .skline-canvas-wrap{position:relative;height:320px;width:100%;}
  .skline-vol-wrap{position:relative;height:80px;width:100%;margin-top:6px;}
  .skline-loader{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;background:var(--surface);border-radius:6px;z-index:5;}
  .skline-src{font-family:var(--font-mono);font-size:10px;color:var(--text-dim);text-align:right;margin-top:6px;}
  #wkTip{
    position:fixed;display:none;
    background:rgba(253,250,244,0.97);
    border:1px solid var(--border);border-radius:8px;
    padding:10px 14px;font-family:var(--font-mono);font-size:11px;
    line-height:1.9;pointer-events:none;z-index:999;min-width:170px;
    box-shadow:0 4px 20px rgba(100,80,50,.15);
  }
  #wkTip .stip-label{font-size:10px;color:var(--text-muted);margin-bottom:2px;}
  #wkTip .stip-row{display:flex;justify-content:space-between;gap:18px;}
  #wkTip .stip-lbl{color:var(--text-muted);}

  /* ── 選擇權損益試算 ── */
  .opt-idx-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .opt-idx-lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);white-space:nowrap;}
  .opt-idx-input{font-family:var(--font-mono);font-size:15px;border:1px solid var(--border);border-radius:8px;padding:7px 10px;background:#f0ebe0;color:var(--text-primary);width:140px;outline:none;}
  .opt-idx-input:focus{border-color:var(--accent-blue);}

  .opt-position{background:#f0ebe0;border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;position:relative;}
  .opt-pos-line1{display:flex;gap:8px;align-items:center;margin-bottom:8px;}
  .opt-pos-line2{display:flex;gap:8px;align-items:center;}
  .opt-toggle-grp{display:flex;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
  .opt-toggle-grp button{font-family:var(--font-mono);font-size:12px;padding:6px 12px;border:none;background:#fdfaf4;color:var(--text-muted);cursor:pointer;transition:all .15s;}
  .opt-toggle-grp button.active{background:var(--accent-blue);color:#fff;}
  .opt-toggle-grp button:first-child{border-right:1px solid var(--border);}
  .opt-field{display:flex;flex-direction:column;flex:1;}
  .opt-field label{font-family:var(--font-mono);font-size:9px;color:var(--text-muted);margin-bottom:3px;}
  .opt-field input{font-family:var(--font-mono);font-size:14px;border:1px solid var(--border);border-radius:6px;padding:6px 8px;background:#fdfaf4;color:var(--text-primary);outline:none;width:100%;}
  .opt-field input:focus{border-color:var(--accent-blue);}
  .opt-del{position:absolute;top:10px;right:10px;background:none;border:none;color:var(--text-dim);font-size:16px;cursor:pointer;padding:2px 6px;line-height:1;}
  .opt-del:hover{color:var(--accent-red);}

  .opt-btn-row{display:flex;gap:8px;margin-top:4px;}
  .opt-btn-add,.opt-btn-calc{font-family:var(--font-mono);font-size:12px;border:none;border-radius:8px;padding:10px 16px;cursor:pointer;flex:1;}
  .opt-btn-add{background:#f0ebe0;border:1px solid var(--border);color:var(--text-muted);}
  .opt-btn-calc{background:var(--accent-blue);color:#fff;}
  .opt-btn-calc:active{opacity:.85;}

  .opt-summary-box{display:flex;gap:8px;flex-wrap:wrap;}
  .opt-sum-item{background:#f0ebe0;border:1px solid var(--border);border-radius:8px;padding:8px 12px;flex:1;min-width:80px;}
  .opt-sum-lbl{font-family:var(--font-mono);font-size:9px;color:var(--text-muted);margin-bottom:3px;}
  .opt-sum-val{font-family:var(--font-mono);font-size:14px;font-weight:500;}

  .opt-table{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:13px;margin-top:4px;}
  .opt-table th{padding:8px 10px;border-bottom:1px solid var(--border);color:var(--text-muted);font-size:10px;text-align:left;font-weight:400;}
  .opt-table th:last-child,.opt-table td:last-child{text-align:right;}
  .opt-table td{padding:7px 10px;border-bottom:1px solid rgba(224,216,200,0.4);}
  .opt-table tr.opt-current td{background:rgba(44,95,138,0.08);font-weight:600;}
  .opt-table tr.opt-be td{background:rgba(184,134,11,0.1);}
  .opt-pnl-pos{color:var(--accent-green);}
  .opt-pnl-neg{color:var(--accent-red);}
  .opt-pnl-zero{color:var(--text-muted);}
  .opt-current-mark{color:var(--accent-blue);margin-right:4px;}

  @media(max-width:640px){
    .opt-idx-input{font-size:16px;width:130px;}
    .opt-toggle-grp button{font-size:12px;padding:7px 10px;}
    .opt-field input{font-size:16px;}
    .opt-table{font-size:13px;}
    .opt-table td,.opt-table th{padding:7px 8px;}
  }
    body{padding:10px;}
    .container{padding:0;}
    header{margin-bottom:14px;padding-bottom:10px;}
    .history-card{padding:12px 14px;margin-bottom:10px;border-radius:10px;}
    .section-header{flex-wrap:wrap;gap:6px;margin-bottom:12px;}
    .section-title{font-size:9px;}

    /* 統計格 2欄 */
    .skline-stats{grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:10px;}
    .skline-stat{padding:8px 10px;}
    .skline-stat-val{font-size:16px;}

    /* K線圖縮小 */
    .skline-canvas-wrap{height:200px;}
    .skline-vol-wrap{height:52px;margin-top:4px;}
    .skline-src{font-size:9px;}

    /* 週期文字換行 */
    #wkDateRange{display:block;width:100%;margin-top:2px;}

    /* 個股清單：手機改卡片式 */
    .wl-table-wrap{display:none;}
    .wl-cards{display:block;}
    .wl-card{
      background:#f0ebe0;border:1px solid var(--border);border-radius:8px;
      padding:10px 12px;margin-bottom:8px;
    }
    .wl-card-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;}
    .wl-card-code{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);}
    .wl-card-name{font-size:15px;font-weight:700;}
    .wl-card-risk{font-family:var(--font-mono);font-size:10px;padding:2px 6px;border-radius:4px;background:rgba(44,95,138,.1);color:var(--accent-blue);}
    .wl-card-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;margin-bottom:6px;}
    .wl-card-item{font-family:var(--font-mono);font-size:10px;}
    .wl-card-lbl{color:var(--text-muted);font-size:9px;margin-bottom:1px;}
    .wl-card-note{font-family:var(--font-mono);font-size:10px;color:var(--text-muted);border-top:1px solid var(--border);padding-top:5px;margin-top:4px;}
  }
  @media(min-width:641px){
    .wl-cards{display:none;}
    .wl-table-wrap{display:block;overflow-x:auto;}
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo"><span>shixianba</span> · 即時看板</div>
  </header>

  <!-- 台指期 週K線（星期三盤後～次週三一般） -->
  <div class="history-card" style="margin-bottom:14px;">
    <div class="section-header">
      <div class="section-title">▪ 台指期　週K線（近20週）</div>
      <div style="font-family:var(--font-mono);font-size:10px;color:var(--text-muted);display:flex;align-items:center;gap:10px;">
        <span>週期：星期四 ～ 次週三</span>
        <span id="wkDateRange" style="color:var(--text-dim)">—</span>
      </div>
    </div>
    <div class="skline-stats">
      <div class="skline-stat"><div class="skline-stat-label">最新收盤</div><div class="skline-stat-val neutral" id="wkClose">—</div></div>
      <div class="skline-stat"><div class="skline-stat-label">本週漲跌</div><div class="skline-stat-val neutral" id="wkChg">—</div></div>
      <div class="skline-stat"><div class="skline-stat-label">區間最高</div><div class="skline-stat-val up" id="wkHigh">—</div></div>
      <div class="skline-stat"><div class="skline-stat-label">區間最低</div><div class="skline-stat-val down" id="wkLow">—</div></div>
    </div>
    <div class="skline-canvas-wrap" id="wkWrap">
      <div class="skline-loader" id="wkLoader">
        <span class="spinner"></span>
        <span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)" id="wkLoaderMsg">載入資料…</span>
      </div>
      <canvas id="wkCanvas"></canvas>
    </div>
    <div class="skline-vol-wrap" id="wvWrap">
      <canvas id="wvCanvas"></canvas>
    </div>
    <div class="skline-src" id="wkSrc">資料來源：台指期歷史試算表（手動維護）・每5分鐘同步試算表異動</div>
  </div>

  <!-- 個股關注清單（可由試算表同步） -->
  <div class="history-card" style="margin-bottom:14px;">
    <div class="section-header">
      <div class="section-title">▪ 個股關注清單</div>
      <div class="oi-date" id="wlUpdateTime"><span class="spinner"></span>載入中...</div>
    </div>
    <div class="wl-table-wrap">
      <table style="width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:12px;">
        <thead>
          <tr style="border-bottom:1px solid var(--border);text-align:left;color:var(--text-muted);font-size:10px;letter-spacing:.05em;">
            <th style="padding:8px 10px;">代號</th>
            <th style="padding:8px 10px;">名稱</th>
            <th style="padding:8px 10px;">營收趨勢</th>
            <th style="padding:8px 10px;">估值位置</th>
            <th style="padding:8px 10px;">風險</th>
            <th style="padding:8px 10px;">題材／備註</th>
          </tr>
        </thead>
        <tbody id="watchlistBody">
          <tr><td colspan="6" style="padding:14px;text-align:center;color:var(--text-muted);">載入中...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="wl-cards" id="watchlistCards"></div>
    <div class="skline-src" id="wlSrc">資料來源：手動內建資料（尚未連結試算表）</div>
  </div>

  <!-- 選擇權損益試算 -->
  <div class="history-card" style="margin-bottom:14px;" id="optCard">
    <div class="section-header">
      <div class="section-title">▪ 選擇權損益試算</div>
    </div>

    <!-- 大盤指數輸入 -->
    <div class="opt-idx-row">
      <label class="opt-idx-lbl">目前大盤指數</label>
      <input type="number" id="optCurrentIdx" class="opt-idx-input" placeholder="例：41600" inputmode="numeric">
    </div>

    <!-- 部位列表 -->
    <div id="optRows"></div>

    <!-- 操作按鈕 -->
    <div class="opt-btn-row">
      <button class="opt-btn-add" onclick="addOptRow()">＋ 新增部位</button>
      <button class="opt-btn-calc" onclick="calcOpt()">計算損益</button>
    </div>

    <!-- 損益摘要 -->
    <div id="optSummary" style="display:none;margin-top:12px;"></div>

    <!-- 損益表 -->
    <div id="optResult" style="margin-top:8px;"></div>
  </div>

</div>

<div id="wkTip">
  <div class="stip-label" id="wkTipLabel"></div>
  <div class="stip-row"><span class="stip-lbl">開</span><span id="wkTipO"></span></div>
  <div class="stip-row"><span class="stip-lbl">高</span><span id="wkTipH" class="up"></span></div>
  <div class="stip-row"><span class="stip-lbl">低</span><span id="wkTipL" class="down"></span></div>
  <div class="stip-row"><span class="stip-lbl">收</span><span id="wkTipC"></span></div>
  <div class="stip-row"><span class="stip-lbl">漲跌</span><span id="wkTipChg"></span></div>
  <div class="stip-row"><span class="stip-lbl">成交量</span><span id="wkTipV" style="color:var(--text-muted)"></span></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════
// 工具
// ══════════════════════════════════════════════════════════════════
const fmtI = n=>n==null?'—':Math.round(n).toLocaleString('zh-TW');
const fmtV = v=>{if(!v||v===0)return'—';if(v>=1e9)return(v/1e9).toFixed(1)+'B';if(v>=1e6)return(v/1e6).toFixed(1)+'M';if(v>=1e3)return(v/1e3).toFixed(0)+'K';return String(v);};

// ══════════════════════════════════════════════════════════════════
// ██  台指期 週K線（星期三盤後 ～ 次週三一般）  ████████████████████
// ══════════════════════════════════════════════════════════════════
// 資料來源：使用者維護的Google試算表（含一般/盤後場次的台指期歷史價）
const FUTURES_CSV_URL = 'https://docs.google.com/spreadsheets/d/1IFA8S0aOafZTtMcSvx45AAtR8Q01aWxcV99xmn9qcrE/export?format=csv&gid=0';

function parseFuturesCSV(text){
  const rows = parseCSV(text);
  return rows.slice(1).map(c=>{
    const dateStr=(c[0]||'').trim();
    const parts=dateStr.split('/').map(Number);
    const y=parts[0], m=parts[1], d=parts[2];
    const o=parseFloat(c[2]), h=parseFloat(c[3]), l=parseFloat(c[4]), cl=parseFloat(c[5]);
    const v=parseFloat(String(c[8]||'0').replace(/,/g,''));
    const session=(c[9]||'').trim();
    return{
      y,m,d,
      dateKey:`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`,
      o,h,l,c:cl,v,session,
    };
  }).filter(r=>r.y && !isNaN(r.o) && !isNaN(r.c));
}

function buildWeeklySessionBars(rows){
  // 同一天：盤後(0) 排在 一般(1) 前面
  const sessionOrder = {'盤後':0,'一般':1};

  // 每筆找出所屬「週四」的日期作為週key
  function getWeekKey(y,m,d){
    const wd = new Date(Date.UTC(y,m-1,d)).getUTCDay(); // 0=日,1=一...4=四,3=三
    const diffToThu = (wd - 4 + 7) % 7; // 距本週四幾天(0=當天就是四)
    const thu = new Date(Date.UTC(y,m-1,d));
    thu.setUTCDate(thu.getUTCDate() - diffToThu);
    return `${thu.getUTCFullYear()}-${String(thu.getUTCMonth()+1).padStart(2,'0')}-${String(thu.getUTCDate()).padStart(2,'0')}`;
  }

  // 分桶
  const buckets = new Map();
  for(const r of rows){
    const key = getWeekKey(r.y, r.m, r.d);
    if(!buckets.has(key)) buckets.set(key,[]);
    buckets.get(key).push(r);
  }

  const keys = [...buckets.keys()].sort();
  return keys.map(key=>{
    // 桶內排序：日期升冪，同天盤後在前
    const slice = buckets.get(key).sort((a,b)=>{
      if(a.dateKey !== b.dateKey) return a.dateKey < b.dateKey ? -1 : 1;
      return (sessionOrder[a.session]??0) - (sessionOrder[b.session]??0);
    });
    const first=slice[0], last=slice[slice.length-1];
    // 計算週結束日（週四+6天=下週三）
    const [ky,km,kd] = key.split('-').map(Number);
    const endDt = new Date(Date.UTC(ky,km-1,kd));
    endDt.setUTCDate(endDt.getUTCDate()+6);
    const endKey = `${endDt.getUTCFullYear()}-${String(endDt.getUTCMonth()+1).padStart(2,'0')}-${String(endDt.getUTCDate()).padStart(2,'0')}`;
    return{
      label:`${String(km).padStart(2,'0')}/${String(kd).padStart(2,'0')}`,
      startDate:`${key}`,
      endDate:`${endKey}`,
      o:first.o,
      h:Math.max(...slice.map(x=>x.h)),
      l:Math.min(...slice.map(x=>x.l)),
      c:last.c,
      v:slice.reduce((s,x)=>s+(x.v||0),0),
      days:slice.length,
    };
  });
}

// ── Canvas 繪圖 ────────────────────────────────────────────────────
const SKP = {top:10, right:58, bottom:32, left:4};
let _wkBars=[], _wkCtx=null, _wvCtx=null;

function sk_p2y(p,h,mn,mx){return SKP.top+(1-(p-mn)/(mx-mn))*(h-SKP.top-SKP.bottom);}
function sk_i2x(i,n,w){return SKP.left+(i+0.5)*((w-SKP.left-SKP.right)/n);}

function drawSK(ctx,w,h,bars,allH,allL){
  ctx.clearRect(0,0,w,h);
  const n=bars.length;
  const pad=(allH-allL)*0.05;
  const mn=allL-pad, mx=allH+pad;
  const bw=Math.max(3,(w-SKP.left-SKP.right)/n*0.58);

  // 格線
  ctx.lineWidth=0.5;
  for(let i=0;i<=5;i++){
    const val=mn+(mx-mn)*(i/5);
    const y=SKP.top+(1-i/5)*(h-SKP.top-SKP.bottom);
    ctx.strokeStyle='rgba(224,216,200,0.6)';
    ctx.beginPath();ctx.moveTo(SKP.left,y);ctx.lineTo(w-SKP.right,y);ctx.stroke();
    ctx.fillStyle='#b0a090';ctx.font='9px DM Mono,monospace';ctx.textAlign='left';
    ctx.fillText(fmtI(val),w-SKP.right+3,y+3);
  }
  // X 標籤（每3根一個）
  ctx.fillStyle='#b0a090';ctx.font='9px DM Mono,monospace';ctx.textAlign='center';
  for(let i=0;i<n;i++){
    if(i%3===0||i===n-1){
      ctx.fillText(bars[i].label,sk_i2x(i,n,w),h-SKP.bottom+13);
    }
  }
  // K線
  for(let i=0;i<n;i++){
    const b=bars[i], x=sk_i2x(i,n,w);
    const isUp=b.c>=b.o;
    const color=isUp?'#c0392b':'#1a7a5e';
    const yH=sk_p2y(b.h,h,mn,mx),yL=sk_p2y(b.l,h,mn,mx);
    const yO=sk_p2y(b.o,h,mn,mx),yC=sk_p2y(b.c,h,mn,mx);
    // 上下影線
    ctx.strokeStyle=color;ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(x,yH);ctx.lineTo(x,yL);ctx.stroke();
    // 實體
    ctx.fillStyle=color;
    ctx.fillRect(x-bw/2,Math.min(yO,yC),bw,Math.max(1.5,Math.abs(yC-yO)));
  }
}

function drawSV(ctx,w,h,bars){
  ctx.clearRect(0,0,w,h);
  const n=bars.length;
  const maxV=Math.max(...bars.map(b=>b.v||0));
  if(!maxV){
    ctx.fillStyle='#c8bfaf';ctx.font='10px DM Mono,monospace';
    ctx.fillText('成交量無資料',12,h/2);return;
  }
  const bw=Math.max(3,(w-SKP.left-SKP.right)/n*0.6);
  const vT=4,vB=16;
  for(let i=0;i<n;i++){
    const b=bars[i];if(!b.v)continue;
    const x=sk_i2x(i,n,w);
    const bh=(b.v/maxV)*(h-vT-vB);
    ctx.fillStyle=b.c>=b.o?'rgba(192,57,43,0.55)':'rgba(26,122,94,0.55)';
    ctx.fillRect(x-bw/2,h-vB-bh,bw,bh);
  }
  ctx.fillStyle='#c8bfaf';ctx.font='9px DM Mono,monospace';ctx.textAlign='left';
  ctx.fillText(fmtV(maxV),w-SKP.right+3,vT+10);
}

function renderWeeklyCharts(){
  if(!_wkBars.length) return;
  resizeWK();
  const allH=Math.max(..._wkBars.map(b=>b.h));
  const allL=Math.min(..._wkBars.map(b=>b.l));
  _wkCtx=document.getElementById('wkCanvas').getContext('2d');
  _wvCtx=document.getElementById('wvCanvas').getContext('2d');
  drawSK(_wkCtx,document.getElementById('wkCanvas').width,document.getElementById('wkCanvas').height,_wkBars,allH,allL);
  drawSV(_wvCtx,document.getElementById('wvCanvas').width,document.getElementById('wvCanvas').height,_wkBars);
  setupWKHover(allH,allL);
}

function setupWKHover(allH,allL){
  const canvas=document.getElementById('wkCanvas');
  const tip=document.getElementById('wkTip');
  const n=_wkBars.length;

  canvas.onmousemove=e=>{
    const rect=canvas.getBoundingClientRect();
    const x=e.clientX-rect.left;
    const w=canvas.width;
    const area=w-SKP.left-SKP.right;
    const idx=Math.min(n-1,Math.max(0,Math.floor((x-SKP.left)/(area/n))));
    const b=_wkBars[idx];
    const chg=b.c-b.o, pct=(chg/b.o*100).toFixed(2);

    drawSK(_wkCtx,w,canvas.height,_wkBars,allH,allL);
    const bx=sk_i2x(idx,n,w);
    _wkCtx.strokeStyle='rgba(44,95,138,0.35)';_wkCtx.lineWidth=1;_wkCtx.setLineDash([3,3]);
    _wkCtx.beginPath();_wkCtx.moveTo(bx,SKP.top);_wkCtx.lineTo(bx,canvas.height-SKP.bottom);_wkCtx.stroke();
    _wkCtx.setLineDash([]);

    document.getElementById('wkTipLabel').textContent=`${b.startDate} → ${b.endDate}  (${b.days}筆資料)`;
    document.getElementById('wkTipO').textContent=fmtI(b.o);
    document.getElementById('wkTipH').textContent=fmtI(b.h);
    document.getElementById('wkTipL').textContent=fmtI(b.l);
    document.getElementById('wkTipC').textContent=fmtI(b.c);
    const tc=document.getElementById('wkTipChg');
    tc.textContent=`${chg>=0?'+':''}${fmtI(chg)} (${chg>=0?'+':''}${pct}%)`;
    tc.className=chg>=0?'up':'down';
    document.getElementById('wkTipV').textContent=fmtV(b.v);

    tip.style.display='block';
    let tx=e.clientX+16, ty=e.clientY-10;
    if(tx+185>window.innerWidth) tx=e.clientX-190;
    tip.style.left=tx+'px';tip.style.top=ty+'px';
  };
  canvas.onmouseleave=()=>{
    tip.style.display='none';
    drawSK(_wkCtx,canvas.width,canvas.height,_wkBars,allH,allL);
  };

  // ── 手機touch支援 ──
  function handleTouch(e){
    e.preventDefault();
    const touch=e.touches[0]||e.changedTouches[0];
    const rect=canvas.getBoundingClientRect();
    const x=touch.clientX-rect.left;
    const w=canvas.width;
    const area=w-SKP.left-SKP.right;
    const idx=Math.min(n-1,Math.max(0,Math.floor((x-SKP.left)/(area/n))));
    const b=_wkBars[idx];
    const chg=b.c-b.o, pct=(chg/b.o*100).toFixed(2);

    drawSK(_wkCtx,w,canvas.height,_wkBars,allH,allL);
    const bx=sk_i2x(idx,n,w);
    _wkCtx.strokeStyle='rgba(44,95,138,0.35)';_wkCtx.lineWidth=1;_wkCtx.setLineDash([3,3]);
    _wkCtx.beginPath();_wkCtx.moveTo(bx,SKP.top);_wkCtx.lineTo(bx,canvas.height-SKP.bottom);_wkCtx.stroke();
    _wkCtx.setLineDash([]);

    document.getElementById('wkTipLabel').textContent=`${b.startDate} → ${b.endDate}`;
    document.getElementById('wkTipO').textContent=fmtI(b.o);
    document.getElementById('wkTipH').textContent=fmtI(b.h);
    document.getElementById('wkTipL').textContent=fmtI(b.l);
    document.getElementById('wkTipC').textContent=fmtI(b.c);
    const tc=document.getElementById('wkTipChg');
    tc.textContent=`${chg>=0?'+':''}${fmtI(chg)} (${chg>=0?'+':''}${pct}%)`;
    tc.className=chg>=0?'up':'down';
    document.getElementById('wkTipV').textContent=fmtV(b.v);

    tip.style.display='block';
    const tx=Math.min(touch.clientX+16, window.innerWidth-195);
    const ty=Math.max(10, touch.clientY-120);
    tip.style.left=tx+'px';tip.style.top=ty+'px';
  }
  canvas.addEventListener('touchmove',handleTouch,{passive:false});
  canvas.addEventListener('touchend',()=>{
    setTimeout(()=>{
      tip.style.display='none';
      drawSK(_wkCtx,canvas.width,canvas.height,_wkBars,allH,allL);
    },1500);
  },{passive:true});
}

async function loadWeeklyKline(){
  const msgEl=document.getElementById('wkLoaderMsg');
  if(msgEl) msgEl.textContent='載入資料…';
  let rows=null;

  try{
    const r=await fetch(`/.netlify/functions/proxy?url=${encodeURIComponent(FUTURES_CSV_URL)}`,{signal:AbortSignal.timeout(15000)});
    if(r.ok){
      const text=await r.text();
      rows=parseFuturesCSV(text);
    }
  }catch(e){console.warn('WK fetch failed:',e.message);}

  if(!rows||rows.length<2){
    const loader=document.getElementById('wkLoader');
    if(loader) loader.innerHTML=`<span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">⚠ 資料載入失敗，請稍後重整</span>`;
    return;
  }

  const allBars=buildWeeklySessionBars(rows);
  const bars=allBars.slice(-20); // 近20週
  _wkBars=bars;

  if(bars.length<2){
    const loader=document.getElementById('wkLoader');
    if(loader) loader.innerHTML=`<span style="font-family:var(--font-mono);font-size:11px;color:var(--text-muted)">⚠ 週線資料不足</span>`;
    return;
  }

  const last=bars[bars.length-1], prev=bars[bars.length-2];
  const chg=last.c-prev.c, pct=(chg/prev.c*100);
  const allH=Math.max(...bars.map(b=>b.h));
  const allL=Math.min(...bars.map(b=>b.l));

  document.getElementById('wkClose').textContent=fmtI(last.c);
  const ce=document.getElementById('wkChg');
  ce.textContent=`${chg>=0?'+':''}${fmtI(chg)} (${pct.toFixed(2)}%)`;
  ce.className='skline-stat-val '+(chg>=0?'up':'down');
  document.getElementById('wkHigh').textContent=fmtI(allH);
  document.getElementById('wkLow').textContent=fmtI(allL);
  document.getElementById('wkDateRange').textContent=`${bars[0].startDate} ～ ${last.endDate}`;

  document.getElementById('wkLoader').style.display='none';
  renderWeeklyCharts();
}

window.addEventListener('resize',()=>{if(_wkBars.length)renderWeeklyCharts();});

function parseCSV(text){
  const rows=[];
  let row=[],cur='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; }
      else cur+=c;
    }else{
      if(c==='"') inQ=true;
      else if(c===','){row.push(cur);cur='';}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur='';}
      else if(c==='\r'){/*忽略*/}
      else cur+=c;
    }
  }
  if(cur||row.length){row.push(cur);rows.push(row);}
  return rows.filter(r=>r.some(c=>c.trim()!==''));
}

    console.warn('watchlist fetch failed:',e.message);
    renderWatchlist(staticWatchlist,'⚠ 試算表讀取失敗，顯示備用資料');

function toggleOpt(grpId,btn){

function calcOpt(){
  const positions=[];
  document.querySelectorAll('.opt-position').forEach(row=>{
    const id=row.id.replace('optRow_','');
    const bsBtn=document.getElementById('bs_'+id)?.querySelector('button.active');
    const cpBtn=document.getElementById('cp_'+id)?.querySelector('button.active');
    const bs=bsBtn?.dataset.val||'B';
    const cp=cpBtn?.dataset.val||'C';
    const strike=parseFloat(row.querySelector('.opt-strike')?.value)||0;
    const premium=parseFloat(row.querySelector('.opt-premium')?.value)||0;
    const lots=parseInt(row.querySelector('.opt-lots')?.value)||1;
    if(strike>0) positions.push({bs,cp,strike,premium,lots});
  });

  if(!positions.length){alert('請先新增部位並輸入履約價');return;}

  const curRaw=parseInt(document.getElementById('optCurrentIdx').value)||0;
  const step=50;
  // 捨入到最近的50整數
  const curIdx=curRaw>0?Math.round(curRaw/step)*step:0;

  const strikes=positions.map(p=>p.strike);
  const minIdx=Math.min(...strikes)-500;
  const maxIdx=Math.max(...strikes)+500;

  const results=[];
  for(let idx=minIdx;idx<=maxIdx;idx+=step){
    let total=0;
    positions.forEach(p=>{
      const isCall=p.cp==='C';
      const isBuy=p.bs==='B';
      const settle=isCall?Math.max(idx-p.strike,0):Math.max(p.strike-idx,0);
      total+=(isBuy?1:-1)*(settle-p.premium)*p.lots*50;
    });
    results.push({idx,pnl:Math.round(total)});
  }

  // 摘要
  const pnls=results.map(r=>r.pnl);
  const maxP=Math.max(...pnls), maxL=Math.min(...pnls);
  const bePts=results.filter((r,i)=>i>0&&((results[i-1].pnl<0&&r.pnl>=0)||(results[i-1].pnl>=0&&r.pnl<0))).map(r=>r.idx);

  const sumEl=document.getElementById('optSummary');
  sumEl.style.display='block';
  sumEl.innerHTML=`<div class="opt-summary-box">
    <div class="opt-sum-item"><div class="opt-sum-lbl">最大獲利</div><div class="opt-sum-val opt-pnl-pos">${maxP>=999999?'無上限':fmtM(maxP)}</div></div>
    <div class="opt-sum-item"><div class="opt-sum-lbl">最大損失</div><div class="opt-sum-val opt-pnl-neg">${maxL<=-999999?'無下限':fmtM(maxL)}</div></div>
    <div class="opt-sum-item"><div class="opt-sum-lbl">損益平衡</div><div class="opt-sum-val" style="color:var(--accent-yellow)">${bePts.length?bePts.join('、'):'—'}</div></div>
  </div>`;

  // 損益表
  let rows='';
  results.forEach(r=>{
    const isCur=curIdx>0&&r.idx===curIdx;
    const rowCls=isCur?'opt-current':'';
    const mark=isCur?'<span class="opt-current-mark">▶</span>':'';
    const pnlCls=r.pnl>0?'opt-pnl-pos':r.pnl<0?'opt-pnl-neg':'opt-pnl-zero';
    rows+=`<tr class="${rowCls}"><td>${mark}${r.idx.toLocaleString()}</td><td class="${pnlCls}">${fmtM(r.pnl)}</td></tr>`;
  });

  document.getElementById('optResult').innerHTML=`
    <div style="overflow-y:auto;max-height:400px;border:1px solid var(--border);border-radius:8px;margin-top:8px;">
      <table class="opt-table">
        <thead><tr><th>指數</th><th style="text-align:right;">結算損益(元)</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;

  setTimeout(()=>{
    const cur=document.querySelector('.opt-table .opt-current');
    if(cur) cur.scrollIntoView({block:'center',behavior:'smooth'});
  },100);
}

function fmtM(n){return(n>=0?'+':'')+n.toLocaleString();}
