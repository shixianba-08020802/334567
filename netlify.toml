[build]
  publish = "public"
  functions = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
       Content-Security-Policy = "default-src 'self' 'unsafe-inline' 'unsafe-eval' fonts.googleapis.com fonts.gstatic.com https://script.google.com https://script.googleusercontent.com; connect-src 'self' /.netlify/functions/ https://script.google.com https://script.googleusercontent.com"
